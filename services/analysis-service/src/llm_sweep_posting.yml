# Posting state of the tier 3 sweep, per class. Read by `llm_sweep.load_sweep_posting_policy`
# and unioned into `main.QUARANTINED_RULE_IDS`, the one filter every detector posts through.
#
# A class posts only when `posting` is `post` AND `precision_evidence` names the measurement
# that justified it. A class missing from this file is quarantined. Every class starts
# quarantined: the sweep runs and is counted, and nothing it says is posted until the class
# has been measured. Changing a value here is a product decision with a measurement behind
# it, not a code change. See docs/validation/tier3-sweep-2026-10.md.
#
# This is the same contract a tier 1 rule carries in `security_rules.py` (`precision`,
# `posting`, `precision_evidence`) and a tier 2 rule carries in its YAML metadata.
classes:
  command_injection:
    posting: quarantine
    precision: unmeasured
    precision_evidence: ""
  cross_site_scripting:
    posting: quarantine
    precision: unmeasured
    precision_evidence: ""
