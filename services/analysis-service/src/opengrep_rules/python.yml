rules:
  # ── Injection (taint tracking) ─────────────────────────────────────────

  - id: cwe-89.sql-injection-fstring
    patterns:
      - pattern: |
          $QUERY = f"...{$INPUT}..."
          ...
          $CURSOR.execute($QUERY)
    message: "SQL query built with f-string interpolation — use parameterized queries"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      confidence: "0.90"

  - id: cwe-89.sql-injection-format
    patterns:
      - pattern: |
          $QUERY = "..." % $INPUT
          ...
          $CURSOR.execute($QUERY)
    message: "SQL query built with string formatting — use parameterized queries"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      confidence: "0.90"

  - id: cwe-78.command-injection-input
    patterns:
      - pattern-either:
        - pattern: os.system(... + $INPUT + ...)
        - pattern: os.system(f"...{$INPUT}...")
        - pattern: subprocess.call($INPUT, shell=True)
        - pattern: subprocess.run($INPUT, shell=True)
        - pattern: subprocess.Popen($INPUT, shell=True)
    message: "Command execution with user-controlled input — use subprocess with argument list"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      confidence: "0.92"

  - id: cwe-22.path-traversal-open
    patterns:
      - pattern-either:
        - pattern: open(... + $INPUT + ...)
        - pattern: open(f"...{$INPUT}...")
        - pattern: open(os.path.join(..., $INPUT))
    message: "File opened with user-controlled path — validate and sanitize file paths"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      confidence: "0.85"

  # ── Deserialization ────────────────────────────────────────────────────

  - id: cwe-502.pickle-loads
    pattern: pickle.loads(...)
    message: "pickle.loads() deserializes arbitrary Python objects — use safe alternatives"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      confidence: "0.95"

  - id: cwe-502.yaml-unsafe-load
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader)
      - pattern-not: yaml.load(..., Loader=yaml.FullLoader)
    message: "yaml.load() without SafeLoader allows arbitrary code execution"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      confidence: "0.92"

  # ── Cryptography ───────────────────────────────────────────────────────

  - id: cwe-327.weak-hash-password
    patterns:
      - pattern-either:
        - pattern: hashlib.md5($PASSWORD)
        - pattern: hashlib.sha1($PASSWORD)
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: .*(pass|pwd|secret|cred).*
    message: "Password hashed with weak algorithm — use bcrypt or argon2"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-916"
      owasp: "A02:2021"
      category: "weak password hashing"
      family: "password_hashing"
      confidence: "0.88"

  # ── SSRF ───────────────────────────────────────────────────────────────

  - id: cwe-918.ssrf-requests
    patterns:
      - pattern-either:
        - pattern: requests.get($URL, ...)
        - pattern: requests.post($URL, ...)
        - pattern: httpx.get($URL, ...)
        - pattern: httpx.post($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: .*(request\.|args\.|form\.|params|input).*
    message: "HTTP request with user-controlled URL — validate against allowlist"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021"
      category: "SSRF"
      confidence: "0.82"

  # ── Flask-specific ─────────────────────────────────────────────────────

  - id: cwe-489.flask-debug
    pattern: app.run(..., debug=True, ...)
    message: "Flask running with debug=True exposes debugger and reloader in production"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-489"
      owasp: "A05:2021"
      category: "security misconfiguration"
      confidence: "0.90"

  - id: cwe-79.flask-render-template-string
    patterns:
      - pattern: render_template_string($INPUT)
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(request\.|args\.|form\.).*
    message: "Template rendered from user input — use render_template with files instead"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-1336"
      owasp: "A03:2021"
      category: "template injection"
      confidence: "0.90"

  # ── XXE ────────────────────────────────────────────────────────────────

  - id: cwe-611.xxe-etree
    patterns:
      - pattern-either:
        - pattern: xml.etree.ElementTree.parse(...)
        - pattern: ET.parse(...)
        - pattern: minidom.parse(...)
        - pattern: minidom.parseString(...)
    message: "XML parsing without disabling external entities — use defusedxml"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-611"
      owasp: "A05:2021"
      category: "XXE"
      confidence: "0.85"

  # ── Hardcoded secrets ──────────────────────────────────────────────────

  - id: cwe-798.hardcoded-secret-assignment
    patterns:
      - pattern-either:
        - pattern: $KEY = "..."
        - pattern: $KEY = '...'
      - metavariable-regex:
          metavariable: $KEY
          regex: .*(api_key|secret_key|auth_token|access_token|password|private_key|client_secret).*
      - pattern-not: $KEY = ""
      - pattern-not: $KEY = "changeme"
      - pattern-not: $KEY = "your_.*"
    message: "Hardcoded credential in source — use environment variables or secret manager"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: "hardcoded secrets"
      confidence: "0.88"
