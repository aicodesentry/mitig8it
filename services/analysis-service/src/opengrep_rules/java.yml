rules:
  - id: cwe-89.sql-injection-concat
    patterns:
      - pattern-either:
        - pattern: |
            String $QUERY = "..." + $INPUT + "...";
            ...
            $STMT.executeQuery($QUERY);
        - pattern: |
            String $QUERY = String.format("...", $INPUT);
            ...
            $STMT.executeQuery($QUERY);
        - pattern: $STMT.executeQuery(<... "..." + $INPUT ...>)
    message: "SQL query built with string concatenation — use PreparedStatement"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      confidence: "0.90"

  - id: cwe-78.runtime-exec
    patterns:
      - pattern-either:
        - pattern: Runtime.getRuntime().exec($CMD)
        - pattern: new ProcessBuilder($CMD).start()
    message: "OS command execution — validate and sanitize input, avoid user-controlled commands"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      confidence: "0.88"

  - id: cwe-502.java-deserialization
    patterns:
      - pattern-either:
        - pattern: new ObjectInputStream(...).readObject()
        - pattern: (ObjectInputStream $OIS).readObject()
        - pattern: new XMLDecoder(...)
    message: "Java deserialization of untrusted data — use allowlist-based filtering"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      confidence: "0.92"

  - id: cwe-611.xxe-document-builder
    patterns:
      - pattern: DocumentBuilderFactory.newInstance()
      - pattern-not-inside: |
          $DBF.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          ...
    message: "XML parser without disabled external entities — set disallow-doctype-decl feature"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-611"
      owasp: "A05:2021"
      category: "XXE"
      confidence: "0.85"

  - id: cwe-79.xss-servlet-response
    patterns:
      - pattern-either:
        - pattern: $RESP.getWriter().print($INPUT)
        - pattern: $RESP.getWriter().println($INPUT)
        - pattern: $RESP.getWriter().write($INPUT)
    message: "Writing unsanitized input to HTTP response — encode output"
    severity: WARNING
    languages: [java]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      confidence: "0.78"

  - id: cwe-327.weak-crypto-java
    patterns:
      - pattern-either:
        - pattern: MessageDigest.getInstance("MD5")
        - pattern: MessageDigest.getInstance("SHA-1")
        - pattern: Cipher.getInstance("DES")
        - pattern: Cipher.getInstance("DES/...")
        - pattern: Cipher.getInstance("AES/ECB/...")
    message: "Weak cryptographic algorithm — use SHA-256+ and AES-GCM"
    severity: WARNING
    languages: [java]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021"
      category: "insecure cryptography"
      confidence: "0.85"

  - id: cwe-295.tls-trust-all
    patterns:
      - pattern-either:
        - pattern: new AllowAllHostnameVerifier()
        - pattern: SSLContext.getInstance("SSL")
    message: "TLS verification bypassed — use proper certificate validation"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-295"
      owasp: "A05:2021"
      category: "security misconfiguration"
      confidence: "0.90"

  - id: cwe-798.hardcoded-secret-java
    patterns:
      - pattern: |
          $TYPE $KEY = "...";
      - metavariable-regex:
          metavariable: $KEY
          regex: .*(password|secret|apiKey|api_key|token|privateKey|private_key).*
    message: "Hardcoded credential — use environment variables or secret manager"
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: "hardcoded secrets"
      confidence: "0.85"
