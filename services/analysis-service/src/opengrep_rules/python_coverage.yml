# Tier 2 coverage rules for Python.
#
# Original work of this repository. No rule here is copied or adapted from
# opengrep-rules or semgrep-rules: both are licensed in a way that forbids use inside a
# paid service. See docs/legal/third-party-rules.md.
#
# Every rule carries `internal_type` (a canonical type from taxonomy.py, never the check
# id), `cwe`, `confidence`, `family` when one of the five remediation families applies,
# and `posting`. `posting: quarantine` means the rule still runs and is still counted but
# nothing it produces reaches a reviewer; the measurement behind each one is in
# docs/validation/tier2-coverage-2026-09.md.
rules:
  # ── SQL injection ──────────────────────────────────────────────────────

  - id: cwe-89.py-execute-fstring-direct
    patterns:
      - pattern-either:
        - pattern: $CURSOR.execute(f"...{$INPUT}...")
        - pattern: $CURSOR.execute(f"...{$INPUT}...", ...)
        - pattern: $CURSOR.executemany(f"...{$INPUT}...", ...)
    message: "SQL passed to execute() as an f-string. Pass the value as a bound parameter"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.90"
      posting: post

  - id: cwe-89.py-execute-concat-direct
    patterns:
      - pattern-either:
        - pattern: $CURSOR.execute("..." + $INPUT)
        - pattern: $CURSOR.execute("..." + $INPUT, ...)
        - pattern: $CURSOR.execute("..." % $INPUT)
        - pattern: $CURSOR.execute("...".format(...))
        - pattern: $CURSOR.execute("..." + $INPUT + "...")
    message: "SQL passed to execute() as a built string. Pass the value as a bound parameter"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.88"
      posting: post

  - id: cwe-89.py-sqlalchemy-text-interpolated
    patterns:
      - pattern-either:
        - pattern: text(f"...{$INPUT}...")
        - pattern: sqlalchemy.text(f"...{$INPUT}...")
        - pattern: text("..." + $INPUT)
        - pattern: text("...".format(...))
    message: "SQLAlchemy text() built by interpolation. Use a :name bind parameter"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.85"
      posting: post

  - id: cwe-89.py-django-raw-interpolated
    patterns:
      - pattern-either:
        - pattern: $M.objects.raw(f"...{$INPUT}...")
        - pattern: $M.objects.raw("..." + $INPUT)
        - pattern: $M.objects.raw("...".format(...))
        - pattern: $M.objects.extra(where=[f"...{$INPUT}..."])
        - pattern: $M.objects.extra(where=["..." + $INPUT])
    message: "Django raw SQL built by interpolation. Pass params to raw() instead"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.88"
      posting: post

  # ── NoSQL injection ────────────────────────────────────────────────────

  - id: cwe-943.py-pymongo-where-operator
    patterns:
      - pattern-either:
        - pattern: '$C.find({..., "$where": $INPUT, ...})'
        - pattern: '$C.find_one({..., "$where": $INPUT, ...})'
    message: "MongoDB $where runs JavaScript on the server. Express the filter with query operators"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021"
      category: "NoSQL injection"
      internal_type: "nosql_injection"
      confidence: "0.88"
      posting: post

  - id: cwe-943.py-pymongo-request-filter
    patterns:
      - pattern-either:
        - pattern: $C.find(request.json)
        - pattern: $C.find(request.get_json())
        - pattern: $C.find_one(request.json)
        - pattern: $C.find_one(request.get_json())
        - pattern: $C.delete_one(request.json)
    message: "Request body used directly as a MongoDB filter. An operator object matches every document"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021"
      category: "NoSQL injection"
      internal_type: "nosql_injection"
      confidence: "0.85"
      posting: post

  # ── Command injection ──────────────────────────────────────────────────

  - id: cwe-78.py-os-system-interpolated
    patterns:
      - pattern-either:
        - pattern: os.system(f"...{$INPUT}...")
        - pattern: os.system("..." + $INPUT)
        - pattern: os.system("...".format(...))
        - pattern: os.system("..." % $INPUT)
    message: "Shell command assembled by interpolation. Use subprocess.run with an argument list"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      internal_type: "command_injection"
      family: "command_arguments"
      confidence: "0.90"
      posting: post

  - id: cwe-78.py-subprocess-shell-interpolated
    patterns:
      - pattern-either:
        - pattern: subprocess.run(f"...{$INPUT}...", ..., shell=True, ...)
        - pattern: subprocess.call(f"...{$INPUT}...", ..., shell=True, ...)
        - pattern: subprocess.Popen(f"...{$INPUT}...", ..., shell=True, ...)
        - pattern: subprocess.check_output(f"...{$INPUT}...", ..., shell=True, ...)
        - pattern: subprocess.run("..." + $INPUT, ..., shell=True, ...)
        - pattern: subprocess.check_output("..." + $INPUT, ..., shell=True, ...)
    message: "subprocess with shell=True on a built command string. Pass an argument list and drop shell"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      internal_type: "command_injection"
      family: "command_arguments"
      confidence: "0.90"
      posting: post

  - id: cwe-78.py-os-popen-interpolated
    patterns:
      - pattern-either:
        - pattern: os.popen(f"...{$INPUT}...")
        - pattern: os.popen("..." + $INPUT)
        - pattern: os.popen(f"...{$INPUT}...", ...)
        - pattern: commands.getoutput(f"...{$INPUT}...")
        - pattern: commands.getstatusoutput(f"...{$INPUT}...")
    message: "os.popen runs a shell string. Use subprocess with an argument list"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      internal_type: "command_injection"
      family: "command_arguments"
      confidence: "0.88"
      posting: post

  # ── Code injection ─────────────────────────────────────────────────────

  - id: cwe-95.py-eval-request-value
    patterns:
      - pattern-either:
        - pattern: eval($INPUT)
        - pattern: eval($INPUT, ...)
        - pattern: exec($INPUT)
        - pattern: exec($INPUT, ...)
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(request\.|args\.|form\.|json\.|payload|user_input|untrusted|body).*
    message: "Request value executed as Python. Parse it with ast.literal_eval or json.loads"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      internal_type: "dynamic_code_execution"
      family: "code_injection_eval"
      confidence: "0.90"
      posting: post

  - id: cwe-95.py-eval-interpolated
    patterns:
      - pattern-either:
        - pattern: eval(f"...{$INPUT}...")
        - pattern: eval("..." + $INPUT)
        - pattern: exec(f"...{$INPUT}...")
        - pattern: exec("..." + $INPUT)
        - pattern: exec("...".format(...))
    message: "Python source assembled by interpolation and executed"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      internal_type: "dynamic_code_execution"
      family: "code_injection_eval"
      confidence: "0.88"
      posting: post

  # ── Server-side template injection ─────────────────────────────────────

  - id: cwe-1336.py-jinja-template-interpolated
    patterns:
      - pattern-either:
        - pattern: Template(f"...{$INPUT}...")
        - pattern: jinja2.Template(f"...{$INPUT}...")
        - pattern: Template("..." + $INPUT)
        - pattern: $ENV.from_string(f"...{$INPUT}...")
        - pattern: $ENV.from_string("..." + $INPUT)
    message: "Template source built by interpolation. The input is template syntax, not data; pass it as a context variable"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-1336"
      owasp: "A03:2021"
      category: "template injection"
      internal_type: "server_side_template_injection"
      confidence: "0.88"
      posting: post

  - id: cwe-79.py-jinja-autoescape-off
    patterns:
      - pattern-either:
        - pattern: jinja2.Environment(..., autoescape=False, ...)
        - pattern: Environment(..., autoescape=False, ...)
        - pattern: jinja2.Environment()
        - pattern: Environment(loader=$L)
    message: "Jinja environment without autoescape. Every rendered variable is raw HTML"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.70"
      posting: quarantine
      posting_evidence: >-
        Zero findings on the September 2026 corpus, and it does not qualify for the
        sink-only exemption: an environment without autoescape is cross-site scripting only
        when the templates render HTML, which the pattern cannot see, and Jinja is widely
        used for configuration files, SQL and email text where autoescape would be wrong.
        Re-enable it when the pattern can tell the template language from the loader.

  # ── XSS ────────────────────────────────────────────────────────────────

  - id: cwe-79.py-django-mark-safe-dynamic
    patterns:
      - pattern-either:
        - pattern: mark_safe(f"...{$INPUT}...")
        - pattern: mark_safe("..." + $INPUT)
        - pattern: mark_safe("...".format(...))
        - pattern: format_html_join($S, "..." + $INPUT, ...)
    message: "mark_safe on a built string turns off escaping for the interpolated value. Use format_html"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.85"
      posting: post

  - id: cwe-79.py-html-response-interpolated
    patterns:
      - pattern-either:
        - pattern: HttpResponse(f"...{$INPUT}...")
        - pattern: HttpResponse("..." + $INPUT)
        - pattern: make_response(f"...<{$TAG}...{$INPUT}...")
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(request\.|args\.|form\.|GET|POST|params|user_input).*
    message: "HTML response interpolates request input. Escape it or render a template"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.82"
      posting: post

  # ── Insecure deserialization ───────────────────────────────────────────

  - id: cwe-502.py-marshal-loads
    patterns:
      - pattern-either:
        - pattern: marshal.loads(...)
        - pattern: marshal.load(...)
    message: "marshal deserializes code objects and is not safe on untrusted input. Use json"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      internal_type: "unsafe_deserialization"
      confidence: "0.88"
      posting: post

  - id: cwe-502.py-dill-shelve-load
    patterns:
      - pattern-either:
        - pattern: dill.loads(...)
        - pattern: dill.load(...)
        - pattern: cloudpickle.loads(...)
        - pattern: jsonpickle.decode(...)
        - pattern: shelve.open(...)
    message: "This loader reconstructs arbitrary Python objects. Use a data-only format for untrusted input"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      internal_type: "unsafe_deserialization"
      confidence: "0.85"
      posting: post

  - id: cwe-502.py-pickle-load-file
    patterns:
      - pattern-either:
        - pattern: pickle.load(...)
        - pattern: cPickle.load(...)
        - pattern: cPickle.loads(...)
        - pattern: pandas.read_pickle(...)
        - pattern: pd.read_pickle(...)
    message: "pickle.load reconstructs arbitrary Python objects. A crafted file runs code at load"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      internal_type: "unsafe_deserialization"
      confidence: "0.88"
      posting: post

  # ── Path traversal and unsafe file access ──────────────────────────────

  - id: cwe-22.py-send-file-request-path
    patterns:
      - pattern-either:
        - pattern: send_file(os.path.join($BASE, request.args.get(...)))
        - pattern: send_file(os.path.join($BASE, request.args[$K]))
        - pattern: send_file(f"...{request.args.get(...)}...")
        - pattern: send_from_directory($BASE, request.args.get(...))
        - pattern: send_file(os.path.join($BASE, $NAME))
      - metavariable-regex:
          metavariable: $NAME
          regex: .*(request\.|filename|user_path|param).*
    message: "Response file chosen by request input. Resolve with realpath and abort before any read outside the base"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      internal_type: "path_traversal"
      family: "path_containment"
      confidence: "0.85"
      posting: post

  - id: cwe-22.py-archive-extractall
    patterns:
      - pattern-either:
        - pattern: $T.extractall(...)
        - pattern: tarfile.open(...).extractall(...)
        - pattern: zipfile.ZipFile(...).extractall(...)
      - pattern-not: $T.extractall(..., filter="data", ...)
      - pattern-not: $T.extractall(..., filter=$F, ...)
    message: "Archive extracted without a member filter. A `../` entry writes outside the destination"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      internal_type: "path_traversal"
      family: "path_containment"
      confidence: "0.80"
      posting: post

  - id: cwe-22.py-open-request-path
    patterns:
      - pattern-either:
        - pattern: open(os.path.join($BASE, request.args.get(...)), ...)
        - pattern: open(os.path.join($BASE, request.args[$K]), ...)
        - pattern: open(f"...{request.args.get(...)}...", ...)
        - pattern: open(f"...{request.form[$K]}...", ...)
    message: "File opened at a request-controlled path. Resolve with realpath and abort before any read outside the base"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      internal_type: "path_traversal"
      family: "path_containment"
      confidence: "0.85"
      posting: post

  # ── SSRF ───────────────────────────────────────────────────────────────

  - id: cwe-918.py-urlopen-request-url
    patterns:
      - pattern-either:
        - pattern: urllib.request.urlopen($URL, ...)
        - pattern: urllib.request.urlopen($URL)
        - pattern: urlopen($URL)
        - pattern: urlopen($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: .*(request\.|args\.|form\.|json\.|params|user_url|target_url).*
    message: "urlopen to a request-controlled URL. Check the host against an allowlist"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021"
      category: "SSRF"
      internal_type: "server_side_request_forgery"
      confidence: "0.85"
      posting: post

  - id: cwe-918.py-requests-interpolated-url
    patterns:
      - pattern-either:
        - pattern: requests.get(f"...{$INPUT}...", ...)
        - pattern: requests.post(f"...{$INPUT}...", ...)
        - pattern: httpx.get(f"...{$INPUT}...", ...)
        - pattern: requests.request($M, f"...{$INPUT}...", ...)
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(request\.|args\.|form\.|json\.|params|user_).*
    message: "Outbound URL interpolates request input. A value with its own scheme or host redirects the request"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021"
      category: "SSRF"
      internal_type: "server_side_request_forgery"
      confidence: "0.82"
      posting: post

  # ── Weak or misused crypto ─────────────────────────────────────────────

  - id: cwe-916.py-password-weak-hash-usedforsecurity
    patterns:
      - pattern-either:
        - pattern: hashlib.md5($SECRET).hexdigest()
        - pattern: hashlib.sha1($SECRET).hexdigest()
        - pattern: hashlib.new("md5", $SECRET)
        - pattern: hashlib.new("sha1", $SECRET)
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(password|passwd|pwd|passphrase|credential|secret).*
      - pattern-not: hashlib.md5($SECRET, usedforsecurity=False)
      - pattern-not: hashlib.sha1($SECRET, usedforsecurity=False)
    message: "Password digested with MD5 or SHA-1. Use bcrypt, scrypt or argon2"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-916"
      owasp: "A02:2021"
      category: "weak password hashing"
      internal_type: "weak_password_hash"
      confidence: "0.88"
      posting: post

  - id: cwe-327.py-ecb-cipher-mode
    patterns:
      - pattern-either:
        - pattern: AES.new($KEY, AES.MODE_ECB)
        - pattern: AES.new($KEY, AES.MODE_ECB, ...)
        - pattern: DES.new(...)
        - pattern: DES3.new(...)
        - pattern: ARC4.new(...)
        - pattern: Cipher($A, modes.ECB(...), ...)
        - pattern: algorithms.Blowfish(...)
    message: "ECB mode and the legacy DES, 3DES, RC4 and Blowfish ciphers leak plaintext structure. Use AES-GCM"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021"
      category: "weak cryptography"
      internal_type: "weak_cipher_algorithm"
      confidence: "0.88"
      posting: post

  - id: cwe-329.py-static-initialization-vector
    patterns:
      - pattern-either:
        - pattern: AES.new($KEY, $MODE, b"...")
        - pattern: AES.new($KEY, $MODE, iv=b"...")
        - pattern: Cipher($A, modes.CBC(b"..."), ...)
        - pattern: Cipher($A, modes.CTR(b"..."), ...)
        - pattern: AES.new($KEY, $MODE, nonce=b"...")
    message: "Cipher constructed with a fixed initialization vector. Derive a fresh IV per message with os.urandom"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-329"
      owasp: "A02:2021"
      category: "weak cryptography"
      internal_type: "static_initialization_vector"
      confidence: "0.88"
      posting: post

  - id: cwe-338.py-random-module-secret
    patterns:
      - pattern-either:
        - pattern: $NAME = random.random()
        - pattern: $NAME = random.randint(...)
        - pattern: $NAME = random.choice(...)
        - pattern: $NAME = "".join(random.choice(...) for $_ in ...)
        - pattern: $NAME = "".join(random.choices(...))
        - pattern: $NAME = random.getrandbits(...)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?!.*(jitter|delay|backoff|sample|sleep|seed)).*(token|secret|nonce|otp|password|api_?key|session_?id|csrf|salt|reset_?code|verification_?code).*$
    message: "Security value taken from the random module, which is not a cryptographic generator. Use the secrets module"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-338"
      owasp: "A02:2021"
      category: "insecure randomness"
      internal_type: "insecure_randomness"
      confidence: "0.85"
      posting: post

  # ── Hardcoded credentials ──────────────────────────────────────────────

  - id: cwe-798.py-connection-string-literal
    patterns:
      - pattern-either:
        - pattern: $NAME = "$VALUE"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|mssql)://[^:/@\s]+:[^@/\s]{6,}@.+$
    message: "Connection string carries a literal password. Read the credential from the environment"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: "hardcoded secrets"
      internal_type: "hardcoded_secret"
      family: "hardcoded_credential"
      confidence: "0.90"
      posting: post

  - id: cwe-798.py-credential-keyword-argument
    patterns:
      - pattern-either:
        - pattern: $F(..., password="$VALUE", ...)
        - pattern: $F(..., passwd="$VALUE", ...)
        - pattern: $F(..., api_key="$VALUE", ...)
        - pattern: $F(..., secret="$VALUE", ...)
        - pattern: $F(..., token="$VALUE", ...)
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!(?:changeme|change_me|your[-_].*|placeholder|redacted|example|secret|password|test|dummy)$)[A-Za-z0-9+/=_.\-]{12,}$
    message: "Credential passed as a literal keyword argument. Read it from the environment"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: "hardcoded secrets"
      internal_type: "hardcoded_secret"
      family: "hardcoded_credential"
      confidence: "0.82"
      posting: post

  # ── JWT misuse ─────────────────────────────────────────────────────────

  - id: cwe-347.py-jwt-verification-disabled
    patterns:
      - pattern-either:
        - pattern: jwt.decode(..., verify=False, ...)
        - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
        - pattern: 'jwt.decode(..., options={..., "verify_exp": False, ...}, ...)'
        - pattern: jwt.get_unverified_header(...)
    message: "JWT decoded without checking the signature. Every claim in it is attacker-controlled"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-347"
      owasp: "A02:2021"
      category: "JWT misuse"
      internal_type: "jwt_signature_not_verified"
      confidence: "0.88"
      posting: post

  - id: cwe-347.py-jwt-none-algorithm
    patterns:
      - pattern-either:
        - pattern: jwt.decode(..., algorithms=["none"], ...)
        - pattern: jwt.decode(..., algorithms=[..., "none", ...], ...)
        - pattern: jwt.encode(..., algorithm="none", ...)
    message: "The `none` JWT algorithm means the token is unsigned. Name the algorithm you accept"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-347"
      owasp: "A02:2021"
      category: "JWT misuse"
      internal_type: "jwt_algorithm_none"
      confidence: "0.92"
      posting: post

  # ── Open redirect ──────────────────────────────────────────────────────

  - id: cwe-601.py-redirect-request-value
    patterns:
      - pattern-either:
        - pattern: redirect(request.args.get(...))
        - pattern: redirect(request.args[$K])
