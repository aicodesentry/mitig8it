rules:
  - id: cwe-89.go-sql-sprintf
    patterns:
      - pattern-either:
        - pattern: $DB.Query(fmt.Sprintf("...", $INPUT))
        - pattern: $DB.Exec(fmt.Sprintf("...", $INPUT))
        - pattern: $DB.QueryRow(fmt.Sprintf("...", $INPUT))
        - pattern: $DB.Query(<... "..." + $INPUT ...>)
    message: "SQL query with string formatting — use parameterized queries with $1 placeholders"
    severity: ERROR
    languages: [go]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      confidence: "0.90"

  - id: cwe-78.go-exec-command
    mode: taint
    pattern-sources:
      - pattern-either:
        - pattern: r.URL.Query().Get(...)
        - pattern: req.URL.Query().Get(...)
        - pattern: r.FormValue(...)
        - pattern: req.FormValue(...)
    pattern-sinks:
      - pattern-either:
        - pattern: exec.Command("sh", "-c", $CMD)
        - pattern: exec.Command("/bin/sh", "-c", $CMD)
        - pattern: exec.Command("bash", "-c", $CMD)
        - pattern: exec.Command("cmd", "/c", $CMD)
        - pattern: exec.CommandContext($CTX, "sh", "-c", $CMD)
        - pattern: exec.CommandContext($CTX, "/bin/sh", "-c", $CMD)
        - pattern: exec.CommandContext($CTX, "bash", "-c", $CMD)
        - pattern: exec.CommandContext($CTX, "cmd", "/c", $CMD)
    message: "Command execution with user input — validate and sanitize arguments"
    severity: ERROR
    languages: [go]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      confidence: "0.85"
      analysis_scope: "taint-intraprocedural"
      source_description: "request-controlled input"
      sink_description: "shell command execution"
      source_var: "$INPUT"
      sink_var: "$CMD"
      trace_summary: "Taint-tracked flow from request-controlled input into shell command execution."

  - id: cwe-22.go-path-traversal
    mode: taint
    pattern-sources:
      - pattern-either:
        - pattern: r.URL.Query().Get(...)
        - pattern: req.URL.Query().Get(...)
        - pattern: r.FormValue(...)
        - pattern: req.FormValue(...)
    pattern-sanitizers:
      - pattern-either:
        - pattern: filepath.Base(...)
        - pattern: path.Base(...)
    pattern-sinks:
      - pattern-either:
        - pattern: os.Open($PATH)
        - pattern: os.OpenFile($PATH, ..., ...)
        - pattern: os.ReadFile($PATH)
        - pattern: ioutil.ReadFile($PATH)
        - pattern: http.ServeFile($W, $R, $PATH)
    message: "File path with user input — use filepath.Clean and validate against base directory"
    severity: WARNING
    languages: [go]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      confidence: "0.82"
      analysis_scope: "taint-intraprocedural"
      source_description: "request-controlled file path"
      sink_description: "filesystem access"
      source_var: "$INPUT"
      sink_var: "$PATH"
      trace_summary: "Taint-tracked flow from request-controlled path input into a filesystem access sink."

  - id: cwe-295.go-tls-insecure
    pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
    message: "TLS verification disabled — remove InsecureSkipVerify"
    severity: ERROR
    languages: [go]
    metadata:
      cwe: "CWE-295"
      owasp: "A05:2021"
      category: "security misconfiguration"
      confidence: "0.95"

  - id: cwe-798.go-hardcoded-secret
    patterns:
      - pattern-either:
        - pattern: $KEY := "..."
        - pattern: "const $KEY = \"...\""
        - pattern: "var $KEY = \"...\""
      - metavariable-regex:
          metavariable: $KEY
          regex: .*(password|secret|apiKey|api_key|token|privateKey|private_key).*
    message: "Hardcoded credential — use environment variables"
    severity: ERROR
    languages: [go]
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: "hardcoded secrets"
      confidence: "0.85"

  - id: cwe-79.go-template-html
    mode: taint
    pattern-sources:
      - pattern-either:
        - pattern: r.URL.Query().Get(...)
        - pattern: req.URL.Query().Get(...)
        - pattern: r.FormValue(...)
        - pattern: req.FormValue(...)
    pattern-sanitizers:
      - pattern-either:
        - pattern: html.EscapeString(...)
        - pattern: template.HTMLEscapeString(...)
    pattern-sinks:
      - pattern-either:
        - pattern: fmt.Fprintf($W, "...", $INPUT)
        - pattern: $W.Write([]byte($INPUT))
    message: "Writing unsanitized input to HTTP response — use html/template for auto-escaping"
    severity: WARNING
    languages: [go]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      confidence: "0.75"
      analysis_scope: "taint-intraprocedural"
      source_description: "request-controlled input"
      sink_description: "HTTP response write"
      source_var: "$INPUT"
      sink_var: "$INPUT"
      trace_summary: "Taint-tracked flow from request-controlled input into an HTTP response sink."

  - id: cwe-327.go-weak-crypto
    patterns:
      - pattern-either:
        - pattern: md5.New()
        - pattern: md5.Sum(...)
        - pattern: sha1.New()
        - pattern: sha1.Sum(...)
        - pattern: des.NewCipher(...)
    message: "Weak cryptographic algorithm — use sha256 and AES-GCM"
    severity: WARNING
    languages: [go]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021"
      category: "insecure cryptography"
      confidence: "0.85"
