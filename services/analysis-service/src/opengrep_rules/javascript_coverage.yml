# Tier 2 coverage rules for JavaScript and TypeScript.
#
# Original work of this repository. No rule here is copied or adapted from
# opengrep-rules or semgrep-rules: both are licensed in a way that forbids use inside a
# paid service. See docs/legal/third-party-rules.md.
#
# Every rule carries `internal_type` (a canonical type from taxonomy.py, never the check
# id), `cwe`, `confidence`, `family` when one of the five remediation families applies,
# and `posting`. `posting: quarantine` means the rule still runs and is still counted but
# nothing it produces reaches a reviewer; the measurement behind each one is in
# docs/validation/tier2-coverage-2026-09.md.
rules:
  # ── SQL injection ──────────────────────────────────────────────────────

  - id: cwe-89.js-knex-raw-interpolated
    patterns:
      - pattern-either:
        - pattern: $DB.raw(`...${$INPUT}...`)
        - pattern: $DB.raw(`...${$INPUT}...`, ...)
        - pattern: knex.raw(`...${$INPUT}...`)
      - pattern-not: $DB.raw(`...${$INPUT}...`, [...])
    message: "Knex raw SQL built by template interpolation. Pass bindings as the second argument"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.85"
      posting: post

  - id: cwe-89.js-query-string-concat
    patterns:
      - pattern-either:
        - pattern: $DB.query("..." + $INPUT, ...)
        - pattern: $DB.query("..." + $INPUT)
        - pattern: $DB.execute("..." + $INPUT, ...)
        - pattern: $DB.execute("..." + $INPUT)
      - pattern-not: $DB.query("..." + "...", ...)
    message: "SQL query assembled by string concatenation. Use a parameterized query"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.85"
      posting: post

  - id: cwe-89.js-sequelize-literal-interpolated
    patterns:
      - pattern-either:
        - pattern: Sequelize.literal(`...${$INPUT}...`)
        - pattern: sequelize.literal(`...${$INPUT}...`)
        - pattern: $S.literal(`...${$INPUT}...`)
        - pattern: Sequelize.where($X, Sequelize.literal(`...${$INPUT}...`))
    message: "Sequelize literal() with interpolated input is raw SQL. Use a replacement or bind parameter"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.82"
      posting: post

  - id: cwe-89.js-typeorm-where-concat
    patterns:
      - pattern-either:
        - pattern: $Q.where("..." + $INPUT)
        - pattern: $Q.andWhere("..." + $INPUT)
        - pattern: $Q.orWhere("..." + $INPUT)
        - pattern: $Q.where(`...${$INPUT}...`)
        - pattern: $Q.andWhere(`...${$INPUT}...`)
    message: "TypeORM where clause built from an interpolated string. Use a named parameter"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: "SQL injection"
      internal_type: "sql_injection"
      family: "sql_parameterization"
      confidence: "0.80"
      posting: post

  # ── NoSQL injection ────────────────────────────────────────────────────

  - id: cwe-943.js-mongo-where-operator
    patterns:
      - pattern-either:
        - pattern: '$C.find({ ..., $where: $INPUT, ... })'
        - pattern: '$C.findOne({ ..., $where: $INPUT, ... })'
        - pattern: '$C.find({ ..., "$where": $INPUT, ... })'
    message: "MongoDB $where runs JavaScript on the server. Express the filter with query operators"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021"
      category: "NoSQL injection"
      internal_type: "nosql_injection"
      confidence: "0.88"
      precision_evidence: >-
        benchmarks/vulnerable-corpus 2026-09: 7 findings in juice-shop, 2 adjudicated by label, both
        true, precision 1.00.
      posting: post

  - id: cwe-943.js-mongo-request-filter
    patterns:
      - pattern-either:
        - pattern: $C.find(req.body)
        - pattern: $C.find(req.query)
        - pattern: $C.findOne(req.body)
        - pattern: $C.findOne(req.query)
        - pattern: $C.deleteOne(req.body)
        - pattern: $C.deleteMany(req.body)
        - pattern: $C.updateOne(req.body, ...)
    message: "Request object used directly as a MongoDB filter. An operator object such as {$ne: null} matches everything"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021"
      category: "NoSQL injection"
      internal_type: "nosql_injection"
      confidence: "0.88"
      posting: post

  # ── Command injection ──────────────────────────────────────────────────

  # `$X.exec(...)` is not a shell. In JavaScript the overwhelmingly common `.exec` is
  # `RegExp.prototype.exec`, and the September 2026 replay proved it: every one of this
  # rule's six findings was `/^(?<socketPath>[^:]+):(?<path>.+)$/v.exec(`${url.pathname}...`)`
  # in got. The receiver is therefore named, and the unqualified forms are kept only where
  # no regex method shares the name: a bare `exec(...)` or `execSync(...)` call is a
  # destructured `child_process` import, because a regex `exec` is always a method call.
  - id: cwe-78.js-exec-interpolated
    patterns:
      - pattern-either:
        - patterns:
          - pattern-either:
            - pattern: $CP.exec(`...${$INPUT}...`, ...)
            - pattern: $CP.exec(`...${$INPUT}...`)
            - pattern: $CP.exec("..." + $INPUT, ...)
            - pattern: $CP.exec("..." + $INPUT)
            - pattern: $CP.execSync(`...${$INPUT}...`, ...)
            - pattern: $CP.execSync(`...${$INPUT}...`)
            - pattern: $CP.execSync("..." + $INPUT, ...)
            - pattern: $CP.execSync("..." + $INPUT)
          - metavariable-regex:
              metavariable: $CP
              regex: ^(?:child_process|childProcess|node_child_process|cp)$
        - pattern: require("child_process").exec(`...${$INPUT}...`, ...)
        - pattern: require("child_process").execSync(`...${$INPUT}...`, ...)
        - pattern: require("node:child_process").exec(`...${$INPUT}...`, ...)
        - pattern: require("node:child_process").execSync(`...${$INPUT}...`, ...)
        - pattern: exec(`...${$INPUT}...`, ...)
        - pattern: exec(`...${$INPUT}...`)
        - pattern: exec("..." + $INPUT, ...)
        - pattern: exec("..." + $INPUT)
        - pattern: execSync(`...${$INPUT}...`, ...)
        - pattern: execSync(`...${$INPUT}...`)
        - pattern: execSync("..." + $INPUT, ...)
        - pattern: execSync("..." + $INPUT)
    message: "Shell command assembled by interpolation. Use execFile or spawn with an argument list"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      internal_type: "command_injection"
      family: "command_arguments"
      confidence: "0.85"
      precision_evidence: >-
        benchmarks/vulnerable-corpus 2026-09: 15 findings over 3 repositories, 2 adjudicated by
        label, both true (logkitty's `adb` calls, CVE-2020-8149), precision 1.00. The narrowing in
        PR 445 did not remove the rule: this is the first corpus that contains its shape.
      posting: post

  - id: cwe-78.js-spawn-shell-true
    patterns:
      - pattern-either:
        - pattern: '$CP.spawn($CMD, $ARGS, { ..., shell: true, ... })'
        - pattern: '$CP.spawnSync($CMD, $ARGS, { ..., shell: true, ... })'
        - pattern: '$CP.execFile($CMD, $ARGS, { ..., shell: true, ... })'
        - pattern: '$CP.execFileSync($CMD, $ARGS, { ..., shell: true, ... })'
    message: "shell: true reintroduces shell metacharacter parsing. Drop it and pass an argument list"
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      internal_type: "command_injection"
      family: "command_arguments"
      confidence: "0.75"
      posting: post

  - id: cwe-78.js-shelljs-interpolated
    patterns:
      - pattern-either:
        - pattern: shelljs.exec(`...${$INPUT}...`, ...)
        - pattern: shelljs.exec(`...${$INPUT}...`)
        - pattern: shell.exec(`...${$INPUT}...`, ...)
        - pattern: shell.exec(`...${$INPUT}...`)
    message: "shelljs.exec runs a shell string. Build the command from an argument list instead"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021"
      category: "command injection"
      internal_type: "command_injection"
      family: "command_arguments"
      confidence: "0.85"
      posting: post

  # ── Code injection ─────────────────────────────────────────────────────

  - id: cwe-95.js-new-function-dynamic
    patterns:
      - pattern-either:
        - pattern: new Function(`...${$INPUT}...`)
        - pattern: new Function("..." + $INPUT)
        - pattern: new Function($A, "..." + $INPUT)
        - pattern: Function(`...${$INPUT}...`)
    message: "Function constructor compiles a built string. The input becomes executable code"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      internal_type: "dynamic_code_execution"
      family: "code_injection_eval"
      confidence: "0.88"
      precision_evidence: >-
        benchmarks/vulnerable-corpus 2026-09: 4 findings over 2 repositories, 1 adjudicated by label
        and true (serialize-to-js deserialisation, CVE-2017-5954), precision 1.00.
      posting: post

  - id: cwe-95.js-eval-interpolated
    patterns:
      - pattern-either:
        - pattern: eval(`...${$INPUT}...`)
        - pattern: eval("..." + $INPUT)
        - pattern: window.eval(`...${$INPUT}...`)
        - pattern: globalThis.eval(`...${$INPUT}...`)
    message: "eval of a built string. Parse the value instead of executing it"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      internal_type: "dynamic_code_execution"
      family: "code_injection_eval"
      confidence: "0.90"
      posting: post

  - id: cwe-95.js-vm-run-dynamic
    patterns:
      - pattern-either:
        - pattern: vm.runInThisContext($INPUT, ...)
        - pattern: vm.runInThisContext($INPUT)
        - pattern: vm.runInNewContext($INPUT, ...)
        - pattern: vm.runInNewContext($INPUT)
        - pattern: vm.runInContext($INPUT, ...)
        - pattern: new vm.Script($INPUT, ...)
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(req\.|request\.|body|query|params|userInput|payload|untrusted).*
    message: "node:vm is not a security boundary. Code run here reaches the host process"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      internal_type: "dynamic_code_execution"
      family: "code_injection_eval"
      confidence: "0.82"
      posting: post

  - id: cwe-95.js-settimeout-string
    patterns:
      - pattern-either:
        - pattern: setTimeout("...", ...)
        - pattern: setInterval("...", ...)
        - pattern: setTimeout(`...${$INPUT}...`, ...)
        - pattern: setInterval(`...${$INPUT}...`, ...)
    message: "A string timer body is evaluated as code. Pass a function"
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021"
      category: "code injection"
      internal_type: "dynamic_code_execution"
      family: "code_injection_eval"
      confidence: "0.80"
      posting: post

  # ── Insecure deserialization ───────────────────────────────────────────

  - id: cwe-502.js-node-serialize-unserialize
    patterns:
      - pattern-either:
        - pattern: serialize.unserialize(...)
        - pattern: nodeSerialize.unserialize(...)
        - pattern: require("node-serialize").unserialize(...)
    message: "node-serialize unserialize executes an embedded function body. Use JSON.parse"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      internal_type: "unsafe_deserialization"
      confidence: "0.92"
      precision_evidence: >-
        benchmarks/vulnerable-corpus 2026-09: 1 finding, adjudicated by label and true (dvna's
        node-serialize sink), precision 1.00.
      posting: post

  - id: cwe-502.js-yaml-load-unsafe
    patterns:
      - pattern-either:
        - pattern: 'jsyaml.load($INPUT, { ..., schema: $S, ... })'
        - pattern: 'yaml.load($INPUT, { ..., schema: jsyaml.DEFAULT_FULL_SCHEMA, ... })'
        - pattern: 'yaml.load($INPUT, { ..., schema: DEFAULT_FULL_SCHEMA, ... })'
      - metavariable-regex:
          metavariable: $S
          regex: .*(FULL|UNSAFE).*
    message: "js-yaml loaded with the full schema constructs arbitrary types. Use the default safe schema"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021"
      category: "insecure deserialization"
      internal_type: "unsafe_deserialization"
      confidence: "0.85"
      posting: post

  # ── Path traversal and unsafe file access ──────────────────────────────

  - id: cwe-22.js-sendfile-request-path
    patterns:
      - pattern-either:
        - pattern: res.sendFile(path.join($BASE, req.params.$P))
        - pattern: res.sendFile(path.join($BASE, req.query.$P))
        - pattern: res.sendFile(path.resolve($BASE, req.params.$P))
        - pattern: res.download(path.join($BASE, req.params.$P))
        - pattern: res.sendFile(`...${req.params.$P}...`)
        - pattern: res.sendFile(`...${req.query.$P}...`)
    message: "Response file chosen by request input. Resolve against the base and reject anything outside it"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      internal_type: "path_traversal"
      family: "path_containment"
      confidence: "0.85"
      posting: post

  - id: cwe-22.js-fs-read-request-path
    patterns:
      - pattern-either:
        - pattern: fs.readFileSync(path.join($BASE, req.params.$P), ...)
        - pattern: fs.readFileSync(path.join($BASE, req.query.$P), ...)
        - pattern: fs.readFile(path.join($BASE, req.params.$P), ...)
        - pattern: fs.readFile(path.join($BASE, req.query.$P), ...)
        - pattern: fs.readFileSync(`...${req.params.$P}...`, ...)
        - pattern: fs.promises.readFile(path.join($BASE, req.params.$P), ...)
    message: "File read at a request-controlled path. Resolve against the base and reject anything outside it"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      internal_type: "path_traversal"
      family: "path_containment"
      confidence: "0.85"
      posting: post

  - id: cwe-22.js-archive-entry-write
    patterns:
      - pattern-either:
        - pattern: fs.writeFileSync(path.join($DEST, $ENTRY.path), ...)
        - pattern: fs.writeFileSync(path.join($DEST, $ENTRY.name), ...)
        - pattern: fs.createWriteStream(path.join($DEST, $ENTRY.path))
        - pattern: fs.createWriteStream(path.join($DEST, $ENTRY.name))
    message: "Archive entry name used as a write path. A `../` entry escapes the destination directory"
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021"
      category: "path traversal"
      internal_type: "path_traversal"
      family: "path_containment"
      confidence: "0.78"
      posting: post

  # ── SSRF ───────────────────────────────────────────────────────────────

  - id: cwe-918.js-fetch-request-url
    patterns:
      - pattern-either:
        - pattern: fetch(req.query.$U, ...)
        - pattern: fetch(req.body.$U, ...)
        - pattern: fetch(req.params.$U, ...)
        - pattern: fetch(req.query.$U)
        - pattern: fetch(req.body.$U)
        - pattern: got(req.query.$U, ...)
        - pattern: got(req.body.$U, ...)
    message: "Outbound request to a URL taken straight from the request. Check it against an allowlist"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021"
      category: "SSRF"
      internal_type: "server_side_request_forgery"
      confidence: "0.85"
      posting: post

  - id: cwe-918.js-http-request-request-url
    patterns:
      - pattern-either:
        - pattern: http.get(req.query.$U, ...)
        - pattern: https.get(req.query.$U, ...)
        - pattern: http.request(req.query.$U, ...)
        - pattern: https.request(req.query.$U, ...)
        - pattern: https.get(req.body.$U, ...)
        - pattern: https.request(req.body.$U, ...)
    message: "node:http request to a request-controlled URL. Check it against an allowlist"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021"
      category: "SSRF"
      internal_type: "server_side_request_forgery"
      confidence: "0.85"
      posting: post

  # ── XSS ────────────────────────────────────────────────────────────────

  - id: cwe-79.js-response-html-interpolated
    patterns:
      - pattern-either:
        - pattern: res.send(`...${req.query.$P}...`)
        - pattern: res.send(`...${req.body.$P}...`)
        - pattern: res.send(`...${req.params.$P}...`)
        - pattern: res.write(`...${req.query.$P}...`)
        - pattern: res.end(`...${req.query.$P}...`)
    message: "Response body interpolates request input. Escape it or send it as data"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.82"
      posting: post

  - id: cwe-79.js-jquery-html-sink
    patterns:
      - pattern-either:
        - pattern: $($X).html($INPUT)
        - pattern: $($X).append($INPUT)
        - pattern: $($X).prepend($INPUT)
        - pattern: jQuery($X).html($INPUT)
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(location\.|document\.URL|document\.referrer|searchParams|hash|req\.|userInput|untrusted).*
    message: "jQuery HTML sink fed from a URL-derived value. Use .text() or sanitize"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.85"
      posting: post

  - id: cwe-79.js-dangerously-set-dynamic
    patterns:
      - pattern-either:
        - pattern: '<$EL dangerouslySetInnerHTML={{ __html: $INPUT }} />'
        - pattern: '<$EL dangerouslySetInnerHTML={{ __html: $INPUT }}>...</$EL>'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{ __html: "..." }} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(...) }} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{ __html: sanitize(...) }} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{ __html: sanitizeHtml(...) }} />'
    message: "dangerouslySetInnerHTML with a dynamic value. Sanitize the HTML before rendering it"
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.70"
      posting: quarantine
      posting_evidence: >-
        Zero findings on the September 2026 corpus, so there is no measurement, and the
        pattern does not qualify for the sink-only exemption: whether the value is
        attacker-controlled is a data-flow question, and most real uses render Markdown or
        CMS HTML that was sanitized where it entered. Re-enable it with a taint source, or
        with a labelled sample from a corpus that contains React views.

  - id: cwe-79.js-dom-html-property-sink
    patterns:
      - pattern-either:
        - pattern: $EL.outerHTML = $INPUT
        - pattern: $EL.innerHTML = $INPUT
        - pattern: $EL.insertAdjacentHTML($POS, $INPUT)
        - pattern: document.write($INPUT)
      - metavariable-regex:
          metavariable: $INPUT
          regex: .*(location\.(search|hash|href)|document\.URL|document\.referrer|searchParams|window\.name).*
    message: "HTML sink fed from a URL-derived value. Assign textContent or sanitize the HTML"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021"
      category: "XSS"
      internal_type: "cross_site_scripting"
      confidence: "0.88"
      posting: post

  # ── Weak or misused crypto ─────────────────────────────────────────────

  - id: cwe-916.js-password-weak-hash
    patterns:
      - pattern-either:
        - pattern: crypto.createHash("md5").update($SECRET)
        - pattern: crypto.createHash("sha1").update($SECRET)
        - pattern: crypto.createHash("md5").update($SECRET, ...)
        - pattern: crypto.createHash("sha1").update($SECRET, ...)
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(password|passwd|pwd|passphrase|credential).*
    message: "Password digested with MD5 or SHA-1. Use bcrypt, scrypt or argon2"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-916"
      owasp: "A02:2021"
      category: "weak password hashing"
      internal_type: "weak_password_hash"
      confidence: "0.88"
      posting: post

  - id: cwe-327.js-ecb-cipher-mode
    patterns:
      - pattern-either:
        - pattern: crypto.createCipheriv("$ALGO", ...)
        - pattern: crypto.createDecipheriv("$ALGO", ...)
        - pattern: crypto.createCipher("$ALGO", ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i).*(-ecb|^des$|^des-|^rc4|^rc2|^bf-|^blowfish).*
    message: "ECB mode and the legacy DES, RC2, RC4 and Blowfish ciphers leak plaintext structure. Use AES-GCM"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021"
      category: "weak cryptography"
      internal_type: "weak_cipher_algorithm"
      confidence: "0.90"
      posting: post

  - id: cwe-329.js-static-initialization-vector
    patterns:
      - pattern-either:
        - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.from("..."))
        - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.alloc($N))
        - pattern: crypto.createCipheriv($ALGO, $KEY, "...")
        - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.from("...", $ENC))
    message: "Cipher constructed with a fixed initialization vector. Derive a fresh IV per message with randomBytes"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-329"
      owasp: "A02:2021"
      category: "weak cryptography"
      internal_type: "static_initialization_vector"
      confidence: "0.88"
      posting: post

  - id: cwe-338.js-math-random-secret
    patterns:
      - pattern-either:
        - pattern: const $NAME = Math.random()
        - pattern: let $NAME = Math.random()
        - pattern: var $NAME = Math.random()
        - pattern: const $NAME = Math.random().toString($R)
        - pattern: let $NAME = Math.random().toString($R)
