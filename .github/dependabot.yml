# Keeps dependencies current and surfaces security updates as PRs.
#
# One group per manifest directory, plus a separate group for the gRPC and protobuf
# runtime wherever one exists. Everything here is on the auto-merge path, so splitting
# production from development and patch from minor produced four pull requests where one
# would do and gave nobody a decision they were actually making. The gRPC group stays
# separate for a reason that is not cosmetic: those packages have to move together with
# the generated stubs, and bundling them with thirty unrelated bumps means an unrelated
# failure blocks a runtime upgrade.
#
# open-pull-requests-limit is set to each entry's group count, so the backlog is bounded
# by the structure rather than by a number somebody picked. Security updates are not
# subject to this limit.
#
# Major updates stay ungrouped so breaking changes arrive one at a time.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 1
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 2
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps(frontend)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      frontend-all:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /services/api-service
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 2
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps(api)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      api-grpc-runtime:
        patterns:
          - "@grpc/*"
          - "google-protobuf"
        update-types:
          - minor
          - patch
      api-everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "@grpc/*"
          - "google-protobuf"
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /services/github-service
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 2
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps(github)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      github-grpc-runtime:
        patterns:
          - "@grpc/*"
          - "google-protobuf"
        update-types:
          - minor
          - patch
      github-everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "@grpc/*"
          - "google-protobuf"
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /proto
    schedule:
      interval: weekly
      day: thursday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 2
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps(proto-js)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      proto-js-grpc-tools:
        patterns:
          - "@grpc/*"
          - "grpc-tools"
        update-types:
          - minor
          - patch
      proto-js-everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "@grpc/*"
          - "grpc-tools"
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: pip
    directory: /services/analysis-service/src
    schedule:
      interval: weekly
      day: thursday
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 2
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps(analysis)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      analysis-grpc-runtime:
        patterns:
          - "grpcio"
          - "grpcio-health-checking"
          - "protobuf"
        update-types:
          - minor
          - patch
      analysis-pip-everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "grpcio"
          - "grpcio-health-checking"
          - "protobuf"
        update-types:
          - patch
          - minor

  - package-ecosystem: pip
    directory: /proto
    schedule:
      interval: weekly
      day: thursday
      time: "11:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 2
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps(proto-py)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      proto-py-grpc-tools:
        patterns:
          - "grpcio"
          - "grpcio-tools"
          - "protobuf"
        update-types:
          - minor
          - patch
      proto-py-everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "grpcio"
          - "grpcio-tools"
          - "protobuf"
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      github-actions-all:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
