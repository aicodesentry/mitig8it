name: Security audit

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # These audits query an external advisory feed, so a CVE published overnight
  # would turn every open pull request red with no code change. They run here on
  # a schedule instead of in the ci.yml required gate, where a failure is news
  # rather than a block on unrelated work.
  npm-audit:
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            directory: frontend
            lockfile: frontend/package-lock.json
          - name: api-service
            directory: services/api-service
            lockfile: services/api-service/package-lock.json
          - name: github-service
            directory: services/github-service
            lockfile: services/github-service/package-lock.json
          - name: proto-js
            directory: proto
            lockfile: proto/package-lock.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}

  pip-audit:
    name: pip-audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: analysis-runtime
            directory: services/analysis-service/src
            requirements: requirements.txt
            audit_args: ""
          - name: analysis-and-action-scanner
            directory: services/analysis-service/src
            requirements: requirements-scanner.txt
            audit_args: >-
              --ignore-vuln CVE-2026-59951
              --ignore-vuln CVE-2026-114603
          - name: remediation-service
            directory: services/remediation-service
            requirements: requirements.txt
            audit_args: ""
          - name: action-runtime
            directory: action
            requirements: requirements.txt
            audit_args: ""
          - name: proto-py
            directory: proto
            requirements: requirements.txt
            audit_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      # Semgrep 1.182.1 pins mcp==1.29.0 and opentelemetry-api~=1.37.0. Their current
      # advisories affect stateful MCP HTTP servers and inbound W3C tracestate parsing. Mitig8it
      # invokes only the offline Semgrep CLI, starts no MCP server, disables Semgrep telemetry,
      # and installs the scanner in dedicated virtualenvs in both production images. Keep the
      # VEX exceptions limited to these two IDs and review them whenever the Semgrep pin moves.
      - run: pip-audit -r "${{ matrix.requirements }}" ${{ matrix.audit_args }}
        working-directory: ${{ matrix.directory }}
