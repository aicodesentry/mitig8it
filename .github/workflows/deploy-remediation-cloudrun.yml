# Deploy the repair (remediation) service to Cloud Run as a single instance.
#
# WARNING: with SANDBOX_DRIVER=local this deployment runs untrusted repository checks inside the
# service container. The local subprocess driver executes a repository's own commands (for
# example `node tests/verify.js`) in this container, with no kernel, network, or filesystem
# isolation and no separate broker trust boundary. Every result it produces is labelled
# `development_unverified`. Use it only for repositories the operator owns and has enrolled as
# test repositories. It is not a production verification path, and nothing it reports may
# justify setting SANDBOX_NETWORK_POLICY_ATTESTED or SANDBOX_NODE_LIMITS_ATTESTED.
#
# `preserve` is the default of the sandbox_driver input below, so a direct manual component
# deployment retains the deployed driver. The ordered production release selects
# `cloud_run_job`, which runs each check in a separate
# Cloud Run job container with its own unprivileged user and a denied network, and evidence is
# then labelled `isolated_job`. That is a real sandbox and still not the production level: it
# has no read-only root filesystem and no gVisor runtime class, and this deployment still has
# no broker trust boundary. Every release that retains or selects it must pass a fresh live
# smoke against its exact digest using the remediation runtime identity, then revalidate that
# receipt immediately before deployment. Neither driver justifies either attestation flag.
#
# Configuration this deployment sets (see docs/runbooks/remediation.md). No secret value is
# embedded here; every credential is a Secret Manager reference resolved by Cloud Run.
#
#   Repository variables (vars.*)
#     GCP_PROJECT_ID                     target project
#     GCP_REGION                         Cloud Run region
#     GAR_REPOSITORY                     Artifact Registry repository, shared with the API image
#     GCP_WORKLOAD_IDENTITY_PROVIDER     preferred auth; falls back to secrets.GCP_SA_KEY
#     GCP_SERVICE_ACCOUNT_EMAIL          service account impersonated by workload identity
#     SANDBOX_JOB_NAME                   Cloud Run job created by infrastructure/remediation/terraform
#     SANDBOX_BUCKET                     snapshots bucket (<prefix>-snapshots)
#     SANDBOX_RESULTS_BUCKET             results bucket (<prefix>-results)
#     SANDBOX_JOB_SERVICE_ACCOUNT        dedicated job identity from Terraform
#     REMEDIATION_SERVICE_ACCOUNT_EMAIL  runtime identity from Terraform; also impersonated for smoke
#
#   Plain environment variables set on the service
#     REMEDIATION_EXECUTION_BACKEND=local      development-only SQLite/file execution store
#     REMEDIATION_LOCAL_STATE_DIR=/tmp/remediation   writable on the Cloud Run instance
#     REMEDIATION_WORKER_INPROCESS=true        the durable worker loop runs in this process
#     REMEDIATION_WORKER_POLL_SECONDS=2        worker idle poll interval
#     SANDBOX_BROKER_MODE=inprocess            no separate broker deployment
#     SANDBOX_DRIVER                           local or cloud_run_job; preserved unless explicitly selected
#     SANDBOX_LOCAL_WORKSPACE_ROOT=/tmp/sandbox     scratch root for local check workspaces
#     SANDBOX_NETWORK_POLICY_ATTESTED=false    must stay false for this deployment
#     SANDBOX_NODE_LIMITS_ATTESTED=false       must stay false for this deployment
#     OTEL_SERVICE_NAME=remediation-service    tracing is inert unless an OTLP endpoint is set
#
#   Set only when SANDBOX_DRIVER=cloud_run_job
#     SANDBOX_JOB_NAME, SANDBOX_JOB_REGION, SANDBOX_JOB_PROJECT
#     SANDBOX_BUCKET, SANDBOX_RESULTS_BUCKET
#     SANDBOX_IMAGE_DIGEST                 the full registry/image@sha256:... this run pushed
#
#   Secret Manager references set on the service (--set-secrets, latest version)
#     REMEDIATION_SERVICE_INTERNAL_SECRET  codesentry-remediation-internal-secret
#     REPAIR_LLM_BASE_URL                  codesentry-repair-llm-base-url
#     REPAIR_LLM_API_KEY                   codesentry-repair-llm-api-key
#     REPAIR_LLM_MODEL                     codesentry-repair-llm-model
#
#   Set on the API service, not here (deploy-api-cloudrun.yml or the console)
#     REMEDIATION_SERVICE_URL              this service's Cloud Run URL
#     REMEDIATION_SERVICE_AUDIENCE         the same URL; makes the API send an identity token
#     REMEDIATION_SERVICE_INTERNAL_SECRET  the same shared secret, sent as x-internal-secret
#     REMEDIATION_WORKER_INPROCESS=true    control-plane worker loop inside the API process
#     REMEDIATION_WORKER_ENABLED, REMEDIATION_ENABLED and the capability flags
#
# The service is deployed --no-allow-unauthenticated: the API calls it with a Cloud Run
# identity token for REMEDIATION_SERVICE_AUDIENCE, and the API's service account needs
# roles/run.invoker on it. Grant that separately; this workflow does not change IAM.

name: Deploy Remediation (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      sandbox_driver:
        description: 'Preserve the deployed driver, or select one explicitly. Every cloud_run_job release requires a fresh live isolation smoke.'
        type: choice
        options: [preserve, local, cloud_run_job]
        default: preserve
        required: false
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      sandbox_driver:
        type: string
        default: preserve
      environment:
        type: string
        default: production
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Serialize image updates and release checks even if two environments were accidentally
  # configured with the same sandbox job. Each environment must still use separate resources.
  group: cloudrun-remediation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.ref != ''
      || (inputs.environment == 'production' && github.ref == 'refs/heads/main')
      || (inputs.environment == 'staging' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      SANDBOX_DRIVER_REQUEST: ${{ inputs.sandbox_driver || 'preserve' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Everything downstream reads $SERVICE and $SECRET_SUFFIX, so the difference
      # between production and staging lives in exactly one step.
      - name: Enforce quality evidence before shipping
        uses: ./.github/actions/quality-readiness
        with:
          environment: ${{ inputs.environment || 'production' }}
          component: remediation

      - name: Resolve environment
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          case "$ENVIRONMENT" in
            production) SUFFIX="" ;;
            staging) SUFFIX="-staging" ;;
            *) echo "Unknown environment: $ENVIRONMENT" >&2; exit 1 ;;
          esac
          {
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "SECRET_SUFFIX=$SUFFIX"
            echo "SERVICE=codesentry-remediation${SUFFIX}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Authenticate to Google Cloud (service account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install the sandbox release verifier
        run: python -m pip install -r services/remediation-service/requirements.txt

      - name: Resolve the requested or currently deployed driver
        shell: bash
        run: |
          set -euo pipefail
          DRIVER=$(python services/remediation-service/scripts/cloud_run_sandbox_release.py resolve-driver \
            --requested "$SANDBOX_DRIVER_REQUEST" --service "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}')
          echo "SANDBOX_DRIVER=$DRIVER" >> "$GITHUB_ENV"

      # Refuse early rather than deploying a service configured for a sandbox this installation
      # has not provisioned. The driver would fail closed at construction, but it would do so
      # after the deploy replaced a working revision.
      - name: Assert the Cloud Run job sandbox is provisioned before selecting it
        if: env.SANDBOX_DRIVER == 'cloud_run_job'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${{ vars.SANDBOX_JOB_NAME }}" ] || missing+=("vars.SANDBOX_JOB_NAME")
          [ -n "${{ vars.SANDBOX_BUCKET }}" ] || missing+=("vars.SANDBOX_BUCKET")
          [ -n "${{ vars.SANDBOX_RESULTS_BUCKET }}" ] || missing+=("vars.SANDBOX_RESULTS_BUCKET")
          [ -n "${{ vars.SANDBOX_JOB_SERVICE_ACCOUNT }}" ] || missing+=("vars.SANDBOX_JOB_SERVICE_ACCOUNT")
          [ -n "${{ vars.REMEDIATION_SERVICE_ACCOUNT_EMAIL }}" ] || missing+=("vars.REMEDIATION_SERVICE_ACCOUNT_EMAIL")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "SANDBOX_DRIVER=cloud_run_job needs ${missing[*]}. Run infrastructure/remediation/terraform with enable_cloud_run_job_sandbox=true and follow docs/runbooks/sandbox-cloud-run-job.md." >&2
            exit 1
          fi
          gcloud run jobs describe '${{ vars.SANDBOX_JOB_NAME }}' \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}' >/dev/null

      - name: Reset Docker auth
        run: |
          rm -f "$HOME/.docker/config.json"
          docker logout docker.io || true
          docker logout registry-1.docker.io || true

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set release metadata
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA=$(git rev-parse HEAD)
          SHORT="${DEPLOY_SHA:0:12}"
          REGISTRY="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}"
          {
            echo "DEPLOY_SHA=${DEPLOY_SHA}"
            echo "IMAGE=${REGISTRY}/remediation:remediation-${SHORT}"
            echo "JOB_IMAGE=${REGISTRY}/remediation-job:remediation-job-${SHORT}"
          } >> "$GITHUB_ENV"

      - name: Build repair image
        run: |
          docker build -f ./services/remediation-service/Dockerfile -t "$IMAGE" ./services/remediation-service

      - name: Assert the pinned Node runtime is in the release image
        run: |
          docker run --rm --entrypoint node "$IMAGE" --version

      - name: Push repair image
        run: |
          docker push "$IMAGE"

      # The sandbox job image is the same Dockerfile with RUNTIME_UID=0: its entrypoint has to
      # drop the repository's check to the separate unprivileged `sandboxcheck` user, and only a
      # process that starts as root can change uid. Cloud Run cannot override a container's
      # user, so the difference lives in the image. The job's own command
      # (`python3 -m src.sandbox.job_entrypoint`) is set by Terraform and is not changed here.
      - name: Build and push the sandbox job image
        if: env.SANDBOX_DRIVER == 'cloud_run_job'
        run: |
          docker build --build-arg RUNTIME_UID=0 \
            -f ./services/remediation-service/Dockerfile -t "$JOB_IMAGE" ./services/remediation-service
          docker run --rm --entrypoint id "$JOB_IMAGE" -u sandboxcheck
          docker push "$JOB_IMAGE"

      # The driver compares the digest each task reads back from the Cloud Run Admin API against
      # SANDBOX_IMAGE_DIGEST and refuses the run on any disagreement, so the job and the service
      # have to be pointed at the same digest in that order: update the job first, then deploy
      # the service with the digest that update produced. The staged deploy below widens
      # the gap between those two: the job carries the new digest while the revision that
      # is still serving carries the old one, so for as long as the candidate is being
      # checked, a sandbox run started by the serving revision is refused. That only
      # happens under SANDBOX_DRIVER=cloud_run_job, which a push to main never selects,
      # and the same disagreement is what docs/runbooks/rollback.md section 3 says to
      # repair by hand after a rollback.
      - name: Point the sandbox job at the new digest
        id: sandbox-image
        if: env.SANDBOX_DRIVER == 'cloud_run_job'
        shell: bash
        run: |
          set -euo pipefail
          DIGEST=$(gcloud artifacts docker images describe "$JOB_IMAGE" \
            --project '${{ vars.GCP_PROJECT_ID }}' --format='value(image_summary.digest)')
          PINNED="${JOB_IMAGE%:*}@${DIGEST}"
          python services/remediation-service/scripts/cloud_run_sandbox_release.py check-image "$PINNED"
          PREVIOUS=$(python services/remediation-service/scripts/cloud_run_sandbox_release.py job-image \
            --job '${{ vars.SANDBOX_JOB_NAME }}' \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}')
          echo "PREVIOUS_SANDBOX_IMAGE=$PREVIOUS" >> "$GITHUB_ENV"
          gcloud run jobs update '${{ vars.SANDBOX_JOB_NAME }}' \
            --image "$PINNED" \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}'
          echo "SANDBOX_IMAGE_DIGEST=${PINNED}" >> "$GITHUB_ENV"

      - name: Verify live sandbox isolation before selecting the driver
        id: sandbox-smoke
        if: env.SANDBOX_DRIVER == 'cloud_run_job'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python services/remediation-service/scripts/cloud_run_sandbox_release.py smoke \
            --job '${{ vars.SANDBOX_JOB_NAME }}' \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}' \
            --image "$SANDBOX_IMAGE_DIGEST" --release-sha "$DEPLOY_SHA" \
            --snapshot-bucket '${{ vars.SANDBOX_BUCKET }}' \
            --result-bucket '${{ vars.SANDBOX_RESULTS_BUCKET }}' \
            --runtime-service-account '${{ vars.REMEDIATION_SERVICE_ACCOUNT_EMAIL }}' \
            --job-service-account '${{ vars.SANDBOX_JOB_SERVICE_ACCOUNT }}' \
            --receipt "$RUNNER_TEMP/sandbox-release-receipt.json"

      - name: Retain sandbox release evidence
        if: always() && steps.sandbox-smoke.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-release-${{ env.DEPLOY_SHA }}-${{ inputs.environment || 'production' }}
          path: ${{ runner.temp }}/sandbox-release-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Compose the service environment
        shell: bash
        run: |
          set -euo pipefail
          VARS="REMEDIATION_EXECUTION_BACKEND=local"
          VARS="${VARS},REMEDIATION_LOCAL_STATE_DIR=/tmp/remediation"
          VARS="${VARS},REMEDIATION_WORKER_INPROCESS=true"
          VARS="${VARS},REMEDIATION_WORKER_POLL_SECONDS=2"
          VARS="${VARS},SANDBOX_BROKER_MODE=inprocess"
          VARS="${VARS},SANDBOX_DRIVER=${SANDBOX_DRIVER}"
          VARS="${VARS},SANDBOX_LOCAL_WORKSPACE_ROOT=/tmp/sandbox"
          VARS="${VARS},SANDBOX_NETWORK_POLICY_ATTESTED=false"
          VARS="${VARS},SANDBOX_NODE_LIMITS_ATTESTED=false"
          VARS="${VARS},OTEL_SERVICE_NAME=remediation-service"
          VARS="${VARS},DEPLOY_ENVIRONMENT=${ENVIRONMENT}"
          if [ "${SANDBOX_DRIVER}" = "cloud_run_job" ]; then
            VARS="${VARS},SANDBOX_JOB_NAME=${{ vars.SANDBOX_JOB_NAME }}"
            VARS="${VARS},SANDBOX_JOB_REGION=${{ vars.GCP_REGION }}"
            VARS="${VARS},SANDBOX_JOB_PROJECT=${{ vars.GCP_PROJECT_ID }}"
            VARS="${VARS},SANDBOX_BUCKET=${{ vars.SANDBOX_BUCKET }}"
            VARS="${VARS},SANDBOX_IMAGE_DIGEST=${SANDBOX_IMAGE_DIGEST}"
            VARS="${VARS},SANDBOX_RESULTS_BUCKET=${{ vars.SANDBOX_RESULTS_BUCKET }}"
          fi
          echo "SERVICE_ENV_VARS=${VARS}" >> "$GITHUB_ENV"

      # Where traffic points right now, so the promote below has somewhere to put it
      # back. The entry that actually carries traffic, not the newest revision: after a
      # promote that failed halfway those are different revisions.
      - name: Record the serving revision
        shell: bash
        run: |
          set -euo pipefail
          # Existence is read from a list and not from a failing describe, because describe
          # fails the same way for a service that is absent and for a credential that
          # cannot read it, and reading the second as a first deploy would quietly send
          # this revision straight to traffic with no gate at all.
          gcloud run services list \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format='value(metadata.name)' > "$RUNNER_TEMP/services.txt"
          if ! grep -Fxq "$SERVICE" "$RUNNER_TEMP/services.txt"; then
            # deploy-staging.yml creates services from scratch, and --no-traffic on a
            # service with no other revision would leave it serving nothing at all, so a
            # first deploy takes traffic the way every deploy used to and has no promote
            # step to reach.
            {
              echo "FIRST_DEPLOY=true"
              echo "PREVIOUS_REVISION="
            } >> "$GITHUB_ENV"
            echo "$SERVICE does not exist yet. It is created serving, and smoked afterwards."
            exit 0
          fi
          gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json > "$RUNNER_TEMP/service-before.json"
          PREVIOUS_REVISION=$(jq -r '
            [.status.traffic[]? | select(.revisionName != null and (.percent // 0) > 0)]
            | sort_by(.percent) | last | .revisionName // ""' "$RUNNER_TEMP/service-before.json")
          {
            echo "FIRST_DEPLOY=false"
            echo "PREVIOUS_REVISION=$PREVIOUS_REVISION"
          } >> "$GITHUB_ENV"
          echo "$SERVICE is serving ${PREVIOUS_REVISION:-no revision this job can name}."

      # One instance, one concurrent request: the local execution store is a per-instance
      # SQLite file. With SANDBOX_DRIVER=local the sandbox also runs checks on this container's
      # CPU; with cloud_run_job the checks run elsewhere and this container only waits on them.
      - name: Deploy repair service
        id: deploy-service
        shell: bash
        run: |
          set -euo pipefail
          STAGE=()
          IDENTITY_FLAGS=()
          if [ "$SANDBOX_DRIVER" = "cloud_run_job" ]; then
            # This reads the current job and immutable execution again, rejects stale receipts,
            # and binds the proof to this commit, image, buckets and runtime identity.
            python services/remediation-service/scripts/cloud_run_sandbox_release.py verify \
              --job '${{ vars.SANDBOX_JOB_NAME }}' \
              --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}' \
              --image "$SANDBOX_IMAGE_DIGEST" --release-sha "$DEPLOY_SHA" \
              --snapshot-bucket '${{ vars.SANDBOX_BUCKET }}' \
              --result-bucket '${{ vars.SANDBOX_RESULTS_BUCKET }}' \
              --runtime-service-account '${{ vars.REMEDIATION_SERVICE_ACCOUNT_EMAIL }}' \
              --job-service-account '${{ vars.SANDBOX_JOB_SERVICE_ACCOUNT }}' \
              --receipt "$RUNNER_TEMP/sandbox-release-receipt.json"
            IDENTITY_FLAGS=(--service-account '${{ vars.REMEDIATION_SERVICE_ACCOUNT_EMAIL }}')
          fi
          # Existing services get an addressable candidate revision with no traffic;
          # first deployments have no prior revision and therefore cannot be staged.
          if [ "$FIRST_DEPLOY" != "true" ]; then
            STAGE+=(--no-traffic --tag candidate)
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            "${IDENTITY_FLAGS[@]}" \
            --region '${{ vars.GCP_REGION }}' \
            --no-cpu-throttling \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --max-instances 1 \
            --min-instances 0 \
            --concurrency 4 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 900 \
            --update-env-vars "$SERVICE_ENV_VARS" \
            --set-secrets "\
              REMEDIATION_SERVICE_INTERNAL_SECRET=codesentry-remediation-internal-secret${SECRET_SUFFIX}:latest,\
              REPAIR_LLM_BASE_URL=codesentry-repair-llm-base-url${SECRET_SUFFIX}:latest,\
              REPAIR_LLM_API_KEY=codesentry-repair-llm-api-key${SECRET_SUFFIX}:latest,\
              REPAIR_LLM_MODEL=codesentry-repair-llm-model${SECRET_SUFFIX}:latest" \
            --port 8002 \
            --no-allow-unauthenticated \
            "${STAGE[@]}"

      - name: Restore the previous sandbox image if the service release was refused
        if: failure() && steps.sandbox-image.outcome == 'success' && steps.deploy-service.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update '${{ vars.SANDBOX_JOB_NAME }}' \
            --image "$PREVIOUS_SANDBOX_IMAGE" \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}'

      # Everything below this point reads the candidate, never the service URL, because
      # the service still answers from the old revision until the promote. On a first
      # deploy there is no tag and the service URL is the new revision, which is the
      # same thing.
      - name: Resolve the candidate
        shell: bash
        run: |
          set -euo pipefail
          DESCRIBED=$(gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json)
          if [ "$FIRST_DEPLOY" = "true" ]; then
            CANDIDATE_REVISION=$(jq -r '.status.latestCreatedRevisionName // ""' <<<"$DESCRIBED")
            SMOKE_URL=$(jq -r '.status.url // ""' <<<"$DESCRIBED")
          else
            # Read the revision out of the tag itself rather than trusting
            # latestCreatedRevisionName, so the checks and the name they report are the
            # same revision the tag resolves to.
            CANDIDATE=$(jq -c '
              [.status.traffic[]? | select(.tag == "candidate")] | first // {}
            ' <<<"$DESCRIBED")
            CANDIDATE_REVISION=$(jq -r '.revisionName // ""' <<<"$CANDIDATE")
            SMOKE_URL=$(jq -r '.url // ""' <<<"$CANDIDATE")
          fi
          if [ -z "$SMOKE_URL" ] || [ -z "$CANDIDATE_REVISION" ]; then
            echo "Could not resolve the candidate for $SERVICE: url='${SMOKE_URL}' revision='${CANDIDATE_REVISION}'." >&2
            echo "Traffic has not been moved. See docs/runbooks/rollback.md." >&2
            exit 1
          fi
          {
            echo "CANDIDATE_REVISION=$CANDIDATE_REVISION"
            echo "SMOKE_URL=$SMOKE_URL"
          } >> "$GITHUB_ENV"
          echo "Candidate $CANDIDATE_REVISION at $SMOKE_URL"

      - name: Smoke the candidate (authenticated /health)
        shell: bash
        run: |
          set -euo pipefail
          # This service is --no-allow-unauthenticated, so the smoke needs an identity
          # token, and the audience has to be the host being called. The candidate tag
          # has its own hostname, so minting the token for the service URL as this step
          # used to would now produce a token Cloud Run rejects with a 401 that looks
          # exactly like a broken revision. Audience is $SMOKE_URL for that reason.
          TOKEN=$(gcloud auth print-identity-token --audiences="$SMOKE_URL")
          curl -sfS --connect-timeout 15 --max-time 45 -H "Authorization: Bearer ${TOKEN}" "${SMOKE_URL}/health"

      # Reached only when a check above failed. Traffic never moved, so there is nothing
      # to undo and this step changes nothing; it says where the bad revision is.
      - name: Report a candidate that failed its checks
        if: failure() && env.FIRST_DEPLOY == 'false' && env.CANDIDATE_REVISION != ''
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "A check against the candidate revision failed. Traffic was NOT moved."
            echo "Still serving: ${PREVIOUS_REVISION:-unknown}"
            echo "Candidate, serving nobody: ${CANDIDATE_REVISION} at ${SMOKE_URL:-unresolved}"
            echo "The candidate tag is left in place on purpose: it is how you reach that"
            echo "revision to debug it, and the next deploy replaces it. It needs an"
            echo "identity token minted for that same candidate URL."
            echo "See docs/runbooks/rollback.md."
          } | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1

      # Only now, with every check green against the candidate. --to-latest hands it all
      # the traffic and also unpins a service that a rollback left pinned to a named
      # revision, which is the state section 3 of docs/runbooks/rollback.md warns leaves
      # deploys looking green while serving old code.
      - name: Promote the candidate
        id: promote
        if: env.FIRST_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services update-traffic "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --to-latest --remove-tags candidate; then
            exit 0
          fi
          # A promote that failed partway can leave traffic split across two revisions,
          # which is worse than either end of it, so put it back where it was.
          echo "Promoting ${CANDIDATE_REVISION} failed." >&2
          if [ -n "${PREVIOUS_REVISION}" ]; then
            echo "Returning all traffic to ${PREVIOUS_REVISION}." >&2
            gcloud run services update-traffic "$SERVICE" \
              --region '${{ vars.GCP_REGION }}' \
              --project '${{ vars.GCP_PROJECT_ID }}' \
              --to-revisions "${PREVIOUS_REVISION}=100" \
              || echo "That failed too. Traffic may be split right now: docs/runbooks/rollback.md section 3." >&2
          else
            echo "No previous revision was recorded, so traffic is left as it is: docs/runbooks/rollback.md section 3." >&2
          fi
          echo "If this deploy selected SANDBOX_DRIVER=cloud_run_job, the sandbox job is now pointed at a digest the serving revision does not expect: docs/runbooks/rollback.md section 3." >&2
          exit 1

      - name: Restore the previous sandbox image when the candidate was rejected
        if: >-
          failure()
          && env.SANDBOX_DRIVER == 'cloud_run_job'
          && steps.sandbox-image.outcome == 'success'
          && steps.deploy-service.outcome == 'success'
          && steps.promote.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update '${{ vars.SANDBOX_JOB_NAME }}' \
            --image "$PREVIOUS_SANDBOX_IMAGE" \
            --region '${{ vars.GCP_REGION }}' --project '${{ vars.GCP_PROJECT_ID }}'

      - name: State which sandbox this revision uses
        shell: bash
        run: |
          if [ "${SANDBOX_DRIVER}" = "cloud_run_job" ]; then
            {
              echo "SANDBOX_DRIVER=cloud_run_job. Checks run in ${{ vars.SANDBOX_JOB_NAME }} at ${SANDBOX_IMAGE_DIGEST}."
              echo "Fresh signed baseline/candidate results and the immutable execution passed the release isolation smoke. Receipt retained as a workflow artifact."
              echo "Evidence is labelled isolated_job, with no read-only root filesystem and no gVisor runtime class."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "SANDBOX_DRIVER=local. Repository checks run inside this service container with no isolation."
              echo "Every result is labelled development_unverified and satisfies no isolation gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
