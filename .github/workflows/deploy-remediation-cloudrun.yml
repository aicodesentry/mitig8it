# Deploy the repair (remediation) service to Cloud Run as a single instance.
#
# WARNING: with SANDBOX_DRIVER=local this deployment runs untrusted repository checks inside the
# service container. The local subprocess driver executes a repository's own commands (for
# example `node tests/verify.js`) in this container, with no kernel, network, or filesystem
# isolation and no separate broker trust boundary. Every result it produces is labelled
# `development_unverified`. Use it only for repositories the operator owns and has enrolled as
# test repositories. It is not a production verification path, and nothing it reports may
# justify setting SANDBOX_NETWORK_POLICY_ATTESTED or SANDBOX_NODE_LIMITS_ATTESTED.
#
# `local` is the default of the sandbox_driver input below, so an ordinary push to main never
# changes which sandbox is in use. Selecting `cloud_run_job` runs each check in a separate
# Cloud Run job container with its own unprivileged user and a denied network, and evidence is
# then labelled `isolated_job`. That is a real sandbox and still not the production level: it
# has no read-only root filesystem and no gVisor runtime class, and this deployment still has
# no broker trust boundary. Do not select it before completing every step of
# docs/runbooks/sandbox-cloud-run-job.md, including the smoke test that proves the job's own
# probes came back denied. Neither driver justifies either attestation flag.
#
# Configuration this deployment sets (see docs/runbooks/remediation.md). No secret value is
# embedded here; every credential is a Secret Manager reference resolved by Cloud Run.
#
#   Repository variables (vars.*)
#     GCP_PROJECT_ID                     target project
#     GCP_REGION                         Cloud Run region
#     GAR_REPOSITORY                     Artifact Registry repository, shared with the API image
#     GCP_WORKLOAD_IDENTITY_PROVIDER     preferred auth; falls back to secrets.GCP_SA_KEY
#     GCP_SERVICE_ACCOUNT_EMAIL          service account impersonated by workload identity
#     SANDBOX_JOB_NAME                   Cloud Run job created by infrastructure/remediation/terraform
#     SANDBOX_BUCKET                     snapshots bucket (<prefix>-snapshots)
#     SANDBOX_RESULTS_BUCKET             results bucket (<prefix>-results); optional, derived when unset
#
#   Plain environment variables set on the service
#     REMEDIATION_EXECUTION_BACKEND=local      development-only SQLite/file execution store
#     REMEDIATION_LOCAL_STATE_DIR=/tmp/remediation   writable on the Cloud Run instance
#     REMEDIATION_WORKER_INPROCESS=true        the durable worker loop runs in this process
#     REMEDIATION_WORKER_POLL_SECONDS=2        worker idle poll interval
#     SANDBOX_BROKER_MODE=inprocess            no separate broker deployment
#     SANDBOX_DRIVER                           local (default) or cloud_run_job, from the input
#     SANDBOX_LOCAL_WORKSPACE_ROOT=/tmp/sandbox     scratch root for local check workspaces
#     SANDBOX_NETWORK_POLICY_ATTESTED=false    must stay false for this deployment
#     SANDBOX_NODE_LIMITS_ATTESTED=false       must stay false for this deployment
#     OTEL_SERVICE_NAME=remediation-service    tracing is inert unless an OTLP endpoint is set
#
#   Set only when SANDBOX_DRIVER=cloud_run_job
#     SANDBOX_JOB_NAME, SANDBOX_JOB_REGION, SANDBOX_JOB_PROJECT
#     SANDBOX_BUCKET, SANDBOX_RESULTS_BUCKET
#     SANDBOX_IMAGE_DIGEST                 the full registry/image@sha256:... this run pushed
#
#   Secret Manager references set on the service (--set-secrets, latest version)
#     REMEDIATION_SERVICE_INTERNAL_SECRET  codesentry-remediation-internal-secret
#     REPAIR_LLM_BASE_URL                  codesentry-repair-llm-base-url
#     REPAIR_LLM_API_KEY                   codesentry-repair-llm-api-key
#     REPAIR_LLM_MODEL                     codesentry-repair-llm-model
#
#   Set on the API service, not here (deploy-api-cloudrun.yml or the console)
#     REMEDIATION_SERVICE_URL              this service's Cloud Run URL
#     REMEDIATION_SERVICE_AUDIENCE         the same URL; makes the API send an identity token
#     REMEDIATION_SERVICE_INTERNAL_SECRET  the same shared secret, sent as x-internal-secret
#     REMEDIATION_WORKER_INPROCESS=true    control-plane worker loop inside the API process
#     REMEDIATION_WORKER_ENABLED, REMEDIATION_ENABLED and the capability flags
#
# The service is deployed --no-allow-unauthenticated: the API calls it with a Cloud Run
# identity token for REMEDIATION_SERVICE_AUDIENCE, and the API's service account needs
# roles/run.invoker on it. Grant that separately; this workflow does not change IAM.

