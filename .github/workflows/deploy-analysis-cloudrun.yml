name: Deploy Analysis (Cloud Run)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      environment:
        type: string
        default: production

permissions:
  contents: read

concurrency:
  # Staging and production are separate services and must not queue behind each other.
  group: cloudrun-deploy-${{ github.workflow }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  filter:
    # A workflow_run deploy must come from a push to this repository. The branches
    # filter above matches the *triggering* run's head branch, so a pull request from
    # a fork whose branch is named main satisfies it. Without the event and
    # head_repository checks the deploy job below would check out that fork's commit
    # and run it with production credentials.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Path filter
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          # Only a CI-triggered deploy is filtered by path. A manual run and a staging
          # run are explicit requests and always deploy.
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git rev-parse HEAD^)
          if git diff --name-only "$BASE" HEAD | grep -qE '^(services/analysis-service/|proto/|\.github/workflows/deploy-analysis-cloudrun\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: filter
    if: needs.filter.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Everything downstream reads $SERVICE and $SECRET_SUFFIX, so the difference
      # between production and staging lives in exactly one step.
      - name: Resolve environment
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          case "$ENVIRONMENT" in
            production)
              SUFFIX=""
              FRONTEND_URL='${{ vars.CODESENTRY_FRONTEND_URL }}'
              ;;
            staging)
              SUFFIX="-staging"
              FRONTEND_URL='${{ vars.CODESENTRY_FRONTEND_URL_STAGING }}'
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          if [ -z "$FRONTEND_URL" ]; then
            echo "Missing frontend URL variable for the $ENVIRONMENT environment" >&2
            exit 1
          fi
          {
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "SECRET_SUFFIX=$SUFFIX"
            echo "SERVICE=codesentry-analysis${SUFFIX}"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Authenticate to Google Cloud (service account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Reset Docker auth
        run: |
          rm -f "$HOME/.docker/config.json"
          docker logout docker.io || true
          docker logout registry-1.docker.io || true

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # The smoke below calls the candidate over gRPC, and ubuntu-latest ships no gRPC
      # client. Pinned by version and checked by digest for the same reason
      # action/Dockerfile pins its Node tarball: this job holds production deploy
      # credentials, so an unpinned fetch into it is the supply chain.
      - name: Install grpcurl
        shell: bash
        env:
          GRPCURL_VERSION: 1.9.4
          GRPCURL_SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 120 -o "$RUNNER_TEMP/grpcurl.tar.gz" \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          echo "${GRPCURL_SHA256}  $RUNNER_TEMP/grpcurl.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/grpcurl.tar.gz" -C "$RUNNER_TEMP/bin" grpcurl
          rm -f "$RUNNER_TEMP/grpcurl.tar.gz"
          "$RUNNER_TEMP/bin/grpcurl" -version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set image tag (match checked-out commit, not GITHUB_SHA)
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          SHORT="${DEPLOY_SHA:0:12}"
          TAG="analysis-${SHORT}"
          IMAGE="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/analysis:${TAG}"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build Analysis image
        run: |
          docker build -f ./services/analysis-service/Dockerfile.prod -t "$IMAGE" ./services/analysis-service
          docker push "$IMAGE"

      # Read before anything changes, because the promote below has to be able to undo
      # itself. The revision that is serving is not always the newest one: a promote that
      # failed half way leaves the two different, and rolling back to the newest would
      # roll back to the revision that broke. A service that does not exist yet is the
      # first deploy of it, which cannot be staged at all; --no-traffic on a service with
      # no serving revision would create it serving nothing. deploy-staging.yml creates
      # the staging services from scratch, so that path is real.
      - name: Record the serving revision
        shell: bash
        run: |
          set -euo pipefail
          # Existence is read from a list and not from a failing describe, because describe
          # fails the same way for a service that is absent and for a credential that
          # cannot read it, and reading the second as a first deploy would quietly send
          # this revision straight to traffic with no gate at all.
          gcloud run services list \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format='value(metadata.name)' > "$RUNNER_TEMP/services.txt"
          if ! grep -Fxq "$SERVICE" "$RUNNER_TEMP/services.txt"; then
            # deploy-staging.yml creates services from scratch, and --no-traffic on a
            # service with no other revision would leave it serving nothing at all, so a
            # first deploy takes traffic the way every deploy used to and has no promote
            # step to reach.
            {
              echo "FIRST_DEPLOY=true"
              echo "PREVIOUS_REVISION="
            } >> "$GITHUB_ENV"
            echo "$SERVICE does not exist yet. It is created serving, and smoked afterwards."
            exit 0
          fi
          gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json > "$RUNNER_TEMP/service-before.json"
          PREVIOUS_REVISION=$(jq -r '
            [.status.traffic[]? | select(.revisionName != null and (.percent // 0) > 0)]
            | sort_by(.percent) | last | .revisionName // ""' "$RUNNER_TEMP/service-before.json")
          {
            echo "FIRST_DEPLOY=false"
            echo "PREVIOUS_REVISION=$PREVIOUS_REVISION"
          } >> "$GITHUB_ENV"
          echo "$SERVICE is serving ${PREVIOUS_REVISION:-no revision this job can name}."

      # --no-traffic with a tag is what turns the smoke below into a gate instead of a
      # report: the candidate is reachable at its own URL while every request keeps going
      # to the revision that was already serving. It does not make the revision safer to
      # start, because gcloud run deploy already waits for Ready before it would shift
      # traffic. The tag is the literal string candidate in every service, so each deploy
      # replaces the last one and tags never accumulate.
      - name: Deploy Analysis
        shell: bash
        run: |
          set -euo pipefail
          STAGE=()
          if [ "$FIRST_DEPLOY" != "true" ]; then
            STAGE=(--no-traffic --tag candidate)
          fi
          gcloud run deploy "$SERVICE" \
            "${STAGE[@]}" \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --use-http2 \
            --port 8080 \
            --startup-probe=grpc.port=8080,initialDelaySeconds=5,timeoutSeconds=5,periodSeconds=10,failureThreshold=6 \
            --liveness-probe=grpc.port=8080,initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=30,failureThreshold=3 \
            --update-env-vars "\
              SERVICE_MODE=grpc,\
              DEPLOY_ENVIRONMENT=${ENVIRONMENT},\
              FRONTEND_URL=${FRONTEND_URL},\
              ANALYSIS_SERVICE_INTERNAL_SECRET=${{ secrets.CODESENTRY_INTERNAL_SECRET }}" \
            --set-secrets "\
              GEMINI_API_KEY=codesentry-gemini-api-key${SECRET_SUFFIX}:latest" \
            --ingress all \
            --no-allow-unauthenticated

      - name: Grant API access to Analysis gRPC service
        shell: bash
        run: |
          set -euo pipefail
          API_INVOKER="${{ vars.CODESENTRY_API_RUNTIME_SERVICE_ACCOUNT }}"
          if [ -z "$API_INVOKER" ]; then
            PROJECT_NUMBER=$(gcloud projects describe '${{ vars.GCP_PROJECT_ID }}' --format='value(projectNumber)')
            API_INVOKER="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --member="serviceAccount:${API_INVOKER}" \
            --role="roles/run.invoker" \
            --quiet

      # Resolved from the service rather than guessed: Cloud Run composes the tag URL
      # itself, and a tag that did not take is the one failure that would otherwise smoke
      # the revision already serving and call it a pass.
      - name: Resolve the candidate URL
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json > "$RUNNER_TEMP/service-after.json"
          CANDIDATE_REVISION=$(jq -r '.status.latestCreatedRevisionName // ""' "$RUNNER_TEMP/service-after.json")
          if [ "$FIRST_DEPLOY" = "true" ]; then
            # Nothing was staged, so the service URL is the only URL there is.
            CANDIDATE_URL=$(jq -r '.status.url // ""' "$RUNNER_TEMP/service-after.json")
          else
            CANDIDATE_URL=$(jq -r 'first(.status.traffic[]? | select(.tag == "candidate") | .url) // ""' "$RUNNER_TEMP/service-after.json")
          fi
          if [ -z "$CANDIDATE_URL" ] || [ -z "$CANDIDATE_REVISION" ]; then
            echo "No candidate to smoke on $SERVICE: url='${CANDIDATE_URL}' revision='${CANDIDATE_REVISION}'." >&2
            exit 1
          fi
          {
            echo "CANDIDATE_URL=$CANDIDATE_URL"
            echo "CANDIDATE_REVISION=$CANDIDATE_REVISION"
          } >> "$GITHUB_ENV"
          echo "Candidate ${CANDIDATE_REVISION} is reachable at ${CANDIDATE_URL}."

      # The point of all of the above: the candidate answers a real RPC before it is
      # allowed to serve anybody. This is the standard gRPC health protocol and not an
      # endpoint invented for the deploy; both servers register grpc.health.v1.Health on
      # the same port the startup probe checks. Neither registers reflection, so grpcurl
      # is handed the health schema instead of asking the server for it. The identity
      # token's audience is the candidate URL because that is the URL being called, the
      # same shape the remediation deploy already uses for its own /health.
      - name: Smoke the candidate (gRPC health)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/health.proto" <<'PROTO'
          syntax = "proto3";
          package grpc.health.v1;
          message HealthCheckRequest { string service = 1; }
          message HealthCheckResponse {
            enum ServingStatus {
              UNKNOWN = 0;
              SERVING = 1;
              NOT_SERVING = 2;
              SERVICE_UNKNOWN = 3;
            }
            ServingStatus status = 1;
          }
          service Health {
            rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
          }
          PROTO
          TOKEN=$(gcloud auth print-identity-token --audiences="$CANDIDATE_URL")
          if RESPONSE=$(grpcurl \
            -import-path "$RUNNER_TEMP" -proto health.proto \
            -H "Authorization: Bearer ${TOKEN}" \
            -connect-timeout 15 -max-time 60 \
            -d '{}' \
            "${CANDIDATE_URL#https://}:443" grpc.health.v1.Health/Check 2>&1); then
            STATUS=$(printf '%s' "$RESPONSE" | jq -r '.status // ""' 2>/dev/null || true)
            if [ "$STATUS" = "SERVING" ]; then
              echo "${CANDIDATE_REVISION} reports SERVING."
              exit 0
            fi
            OUTCOME="grpc.health.v1.Health/Check answered ${STATUS:-nothing this step could parse}"
          else
            OUTCOME="grpc.health.v1.Health/Check could not be completed"
          fi
          {
            echo "Smoke failed against the candidate: ${OUTCOME}."
            echo "$RESPONSE"
            echo "Candidate revision: ${CANDIDATE_REVISION} at ${CANDIDATE_URL}"
            if [ "$FIRST_DEPLOY" = "true" ]; then
              echo "This was the first deploy of $SERVICE, so it was created serving and there"
              echo "is no earlier revision to fall back to."
            else
              echo "Serving revision:   ${PREVIOUS_REVISION:-none recorded}"
              echo "Traffic was not moved, so there is nothing to undo."
              echo "The candidate tag is left in place so this revision can be reached directly"
              echo "for debugging; the next deploy replaces it."
            fi
            echo "docs/runbooks/rollback.md is the procedure if it turns out traffic has moved."
          } >&2
          exit 1

      # Only now does the candidate get traffic. A promote that half applies is the one
      # state worse than either end of it, so a failure here puts traffic back where the
      # job found it and still fails.
      - name: Promote the candidate
        if: env.FIRST_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services update-traffic "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --to-latest --remove-tags candidate; then
            echo "$SERVICE now serves ${CANDIDATE_REVISION}."
            exit 0
          fi
          {
            echo "Promoting ${CANDIDATE_REVISION} on $SERVICE failed."
            if [ -n "${PREVIOUS_REVISION:-}" ]; then
              echo "Putting traffic back on ${PREVIOUS_REVISION}."
            else
              echo "No serving revision was recorded before this deploy, so there is nothing"
              echo "to put traffic back on. docs/runbooks/rollback.md section 3."
            fi
          } >&2
          if [ -n "${PREVIOUS_REVISION:-}" ]; then
            gcloud run services update-traffic "$SERVICE" \
              --region '${{ vars.GCP_REGION }}' \
              --project '${{ vars.GCP_PROJECT_ID }}' \
              --to-revisions "${PREVIOUS_REVISION}=100" \
              || echo "That failed too. docs/runbooks/rollback.md section 3 is the manual procedure." >&2
          fi
          exit 1

      # The split, not just the URL. A percentage that is not 100 on one revision is the
      # shape a pinned rollback leaves behind, and section 3 of docs/runbooks/rollback.md
      # says that is the state in which a green deploy can still be serving old code.
      - name: Report what is serving
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json > "$RUNNER_TEMP/service-final.json"
          jq -r '"\(.status.url)  traffic: " + ([.status.traffic[]?
            | "\(.revisionName)=\(.percent)%\(if .tag then " tag:" + .tag else "" end)"]
            | join(", "))' "$RUNNER_TEMP/service-final.json"
