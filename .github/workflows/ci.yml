name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel duplicate runs on feature branches; do not cancel on main (avoids
# aborting the run that deploy workflows wait on when pushes are back-to-back).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: only what these jobs need. dependency-review uses the
# default GITHUB_TOKEN to read the dependency graph and PR diff.
permissions:
  contents: read
  pull-requests: read

jobs:
  # --- Repo-wide security (blocks deploy with the same "CI" workflow) ---

  security-gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Compares base vs head dependency changes on PRs. Private repos need
  # GitHub Advanced Security; public repos work out of the box. Set the
  # ENABLE_DEPENDENCY_REVIEW repository variable to "true" after enabling
  # Advanced Security/dependency graph support for a private repository.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Skip when dependency review is unavailable
        if: ${{ github.event_name != 'pull_request' || (github.event.repository.private && vars.ENABLE_DEPENDENCY_REVIEW != 'true') }}
        run: echo "Dependency review only runs on pull requests, and private repositories must opt in with ENABLE_DEPENDENCY_REVIEW=true."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true') }}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true') }}
        with:
          # Change to critical if moderate/high noise is too high.
          fail-on-severity: high

  npm-audit:
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            directory: frontend
            lockfile: frontend/package-lock.json
          - name: api-service
            directory: services/api-service
            lockfile: services/api-service/package-lock.json
          - name: github-service
            directory: services/github-service
            lockfile: services/github-service/package-lock.json
          - name: proto-js
            directory: proto
            lockfile: proto/package-lock.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}

  pip-audit:
    name: pip-audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: analysis-service
            directory: services/analysis-service/src
            requirements: requirements.txt
            audit_args: >-
              --ignore-vuln PYSEC-2026-3481
              --ignore-vuln PYSEC-2026-3482
              --ignore-vuln PYSEC-2026-3483
          - name: proto-py
            directory: proto
            requirements: requirements.txt
            audit_args: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      # Semgrep 1.172.0 pins mcp 1.23.3. Keep these ignored until Semgrep
      # ships a compatible release with mcp >=1.28.1.
      - run: pip-audit -r "${{ matrix.requirements }}" ${{ matrix.audit_args }}
        working-directory: ${{ matrix.directory }}

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Migration pipeline check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run db:migrate
          npm run db:verify
          npm run db:migrate

  github-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/github-service
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/github-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand

  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-service/src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/analysis-service/src/requirements.txt
            services/analysis-service/src/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pip install bandit
      # B608 skipped: Bandit flags LLM prompt strings as "SQL injection".
      - name: bandit
        run: >
          bandit -r . -ll -q
          -x ./tests -x ./grpc_generated -x ./grpc_server/generated
          -s B608
      - run: pytest tests -q

  docker-build:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-service
          - github-service
          - analysis-service
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: docker build
        run: docker build "./services/${{ matrix.service }}"

  ci-required:
    name: Required CI
    runs-on: ubuntu-latest
    needs:
      - security-gitleaks
      - dependency-review
      - npm-audit
      - pip-audit
      - frontend-checks
      - api-tests
      - github-service-tests
      - analysis-tests
      - docker-build
    if: ${{ always() }}
    steps:
      - name: Report required job results
        run: |
          echo '${{ toJSON(needs) }}'
      - name: Fail when any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
