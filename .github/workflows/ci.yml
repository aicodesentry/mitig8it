name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# Cancel duplicate runs on feature branches; do not cancel on deploy branches (avoids
# aborting the run that an environment deployment waits on when pushes are back-to-back).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

# Least privilege: only what these jobs need. dependency-review uses the
# default GITHUB_TOKEN to read the dependency graph and PR diff.
permissions:
  contents: read
  pull-requests: read

jobs:
  # --- Repo-wide security (blocks deploy with the same "CI" workflow) ---

  security-gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Compares base vs head dependency changes on PRs. Private repos need
  # GitHub Advanced Security; public repos work out of the box. Set the
  # ENABLE_DEPENDENCY_REVIEW repository variable to "true" after enabling
  # Advanced Security/dependency graph support for a private repository.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip when dependency review is unavailable
        if: ${{ github.event_name != 'pull_request' || (github.event.repository.private && vars.ENABLE_DEPENDENCY_REVIEW != 'true') }}
        run: echo "Dependency review only runs on pull requests, and private repositories must opt in with ENABLE_DEPENDENCY_REVIEW=true."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true') }}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true') }}
        with:
          # Change to critical if moderate/high noise is too high.
          fail-on-severity: high

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Database regression tests
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mitig8it_access_test'
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mitig8it_lifecycle_test'
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mitig8it_purge_test'
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mitig8it_runtime_role_test'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/mitig8it_access_test npm run test:integration:access
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/mitig8it_lifecycle_test npm run test:integration:lifecycle
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/mitig8it_purge_test npm run test:integration:purge
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/mitig8it_runtime_role_test npm run test:integration:runtime-role
      - name: Migration pipeline check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run db:migrate
          npm run db:verify
          npm run db:migrate

  github-service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/github-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/github-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand

  analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/analysis-service/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/analysis-service/src/requirements.txt
            services/analysis-service/src/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pip install bandit
      # B608 skipped: Bandit flags LLM prompt strings as "SQL injection".
      - name: bandit
        run: >
          bandit -r . -ll -q
          -x ./tests -x ./grpc_generated -x ./grpc_server/generated
          -s B608
      - run: pytest tests -q

      - name: Rule publication precision gate
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest benchmarks/test_detection_evaluation.py benchmarks/test_eval.py \
            benchmarks/test_quality_gate.py benchmarks/test_production_readiness.py -q
          python -m benchmarks.rule_quality_gate
          python -m benchmarks.production_readiness --report-only

  docker-build:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-service
            context: services/api-service
            dockerfile: Dockerfile
          - name: api-service (prod)
            context: services/api-service
            dockerfile: Dockerfile.prod
          - name: github-service
            context: services/github-service
            dockerfile: Dockerfile
          - name: github-service (prod)
            context: services/github-service
            dockerfile: Dockerfile.prod
          - name: analysis-service
            context: services/analysis-service
            dockerfile: Dockerfile
          - name: analysis-service (prod)
            context: services/analysis-service
            dockerfile: Dockerfile.prod
          - name: remediation-service
            context: services/remediation-service
            dockerfile: Dockerfile
          - name: sandbox-broker
            context: services/remediation-service
            dockerfile: Dockerfile.broker
          - name: sandbox-runner
            context: services/remediation-service
            dockerfile: Dockerfile.runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: docker build
        run: docker build -f "${{ matrix.context }}/${{ matrix.dockerfile }}" "${{ matrix.context }}"

  # Remediation workflow tests against a real disposable PostgreSQL database.
  # Fixtures and doubles only: no provider, sandbox, or GitHub calls, so a pass
  # here is pipeline integrity, not repair quality.
  remediation-integration-tests:
    name: Remediation integration (API service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/api-service/package-lock.json
      - run: npm ci
      - name: Remediation integration tests
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mitig8it_remediation_test'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/mitig8it_remediation_test npm run test:integration:remediation

  remediation-github-tests:
    name: Remediation contract (GitHub service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/github-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/github-service/package-lock.json
      - run: npm ci
      # Contract tests only. The opt-in staging GitHub acceptance suite is not
      # run here and needs a real installation.
      - run: npm run test:remediation

  remediation-browser-tests:
    name: Remediation browser (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fixture-driven flows; no API, repair service, or GitHub backend runs.
      - run: npm run test:remediation-browser

  # The repair service and the action suites also run in remediation.yml and action-build.yml,
  # but those are path-filtered, and a skipped workflow cannot be a required check. These two
  # jobs make both suites part of Required CI on every pull request. The setup matches the
  # path-filtered jobs so the two places test the same thing.
  remediation-service-tests:
    name: Repair service unit and broker contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          # Python 3.12 matches services/remediation-service/Dockerfile.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/remediation-service/requirements-test.txt
      - run: pip install -r services/remediation-service/requirements-test.txt
      # The static assertion tests drive the real rule oracle, which shells out to the analysis
      # service's scanner. It goes in its own virtualenv for the reason remediation.yml gives:
      # the scanner and this service pin conflicting opentelemetry versions.
      - name: Install the scanner the rule oracle runs, beside the test environment
        run: |
          set -euo pipefail
          version="$(sed -n 's/^semgrep==\(.*\)$/\1/p' services/analysis-service/src/requirements.txt | head -n 1)"
          if [ -z "${version}" ]; then
            echo "services/analysis-service/src/requirements.txt no longer pins semgrep" >&2
            exit 1
          fi
          python -m venv /tmp/rule-scanner
          /tmp/rule-scanner/bin/pip install --disable-pip-version-check "semgrep==${version}"
          mkdir -p /tmp/rule-scanner-bin
          ln -sf /tmp/rule-scanner/bin/semgrep /tmp/rule-scanner-bin/semgrep
          echo "/tmp/rule-scanner-bin" >> "$GITHUB_PATH"
      - name: The rule oracle must be available here, so its tests run rather than skip
        run: |
          set -euo pipefail
          semgrep --version
          python - <<'PY'
          import sys
          sys.path.insert(0, "services/remediation-service")
          from src.verification.static_assertion import InProcessRuleOracle
          reason = InProcessRuleOracle.unavailable_reason()
          if reason is not None:
              sys.exit(f"the static assertion tests would skip in this job: {reason}")
          PY
      - run: pytest services/remediation-service/tests -q

  action-tests:
    name: Action orchestrator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      # The parity tests run the Node implementation, on the major the action image pins.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install the test dependencies
        run: pip install pytest httpx pyyaml
      - name: Run the tests
        run: pytest tests -q
        working-directory: action

  ci-required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - security-gitleaks
      - dependency-review
      - frontend-checks
      - api-tests
      - github-service-tests
      - analysis-tests
      - docker-build
      - remediation-integration-tests
      - remediation-github-tests
      - remediation-browser-tests
      - remediation-service-tests
      - action-tests
    if: ${{ always() }}
    steps:
      - name: Report required job results
        run: |
          echo '${{ toJSON(needs) }}'
      # Required CI passes only when every needed job succeeded. A job that hits its
      # timeout-minutes is reported as cancelled, and a job skipped by a failed dependency or a
      # condition did not run its checks, so treating either as a pass would let a hung or
      # unrun suite turn this check green. A run cancelled because a newer push superseded it
      # reports on the old commit; the newer run reports on the new one.
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::At least one required job did not succeed (failure, cancelled or skipped). See the results above."
          exit 1
