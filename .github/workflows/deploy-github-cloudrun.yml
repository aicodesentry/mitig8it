name: Deploy GitHub Service (Cloud Run)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      environment:
        type: string
        default: production

permissions:
  contents: read

concurrency:
  # Staging and production are separate services and must not queue behind each other.
  group: cloudrun-deploy-${{ github.workflow }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  filter:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Path filter
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          # Only a CI-triggered deploy is filtered by path. A manual run and a staging
          # run are explicit requests and always deploy.
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git rev-parse HEAD^)
          if git diff --name-only "$BASE" HEAD | grep -qE '^(services/github-service/|proto/|\.github/workflows/deploy-github-cloudrun\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: filter
    if: needs.filter.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Everything downstream reads $SERVICE and $SECRET_SUFFIX, so the difference
      # between production and staging lives in exactly one step.
      - name: Resolve environment
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          case "$ENVIRONMENT" in
            production)
              SUFFIX=""
              FRONTEND_URL='${{ vars.CODESENTRY_FRONTEND_URL }}'
              ;;
            staging)
              SUFFIX="-staging"
              FRONTEND_URL='${{ vars.CODESENTRY_FRONTEND_URL_STAGING }}'
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          if [ -z "$FRONTEND_URL" ]; then
            echo "Missing frontend URL variable for the $ENVIRONMENT environment" >&2
            exit 1
          fi
          {
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "SECRET_SUFFIX=$SUFFIX"
            echo "SERVICE=codesentry-github${SUFFIX}"
            echo "FRONTEND_URL=$FRONTEND_URL"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Authenticate to Google Cloud (service account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Reset Docker auth
        run: |
          rm -f "$HOME/.docker/config.json"
          docker logout docker.io || true
          docker logout registry-1.docker.io || true

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set image tag (match checked-out commit, not GITHUB_SHA)
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          SHORT="${DEPLOY_SHA:0:12}"
          TAG="github-${SHORT}"
          IMAGE="us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/github:${TAG}"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build GitHub Service image
        run: |
          docker build -f ./services/github-service/Dockerfile.prod -t "$IMAGE" ./services/github-service
          docker push "$IMAGE"

      - name: Deploy GitHub Service
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --use-http2 \
            --port 8080 \
            --startup-probe=grpc.port=8080,initialDelaySeconds=5,timeoutSeconds=5,periodSeconds=10,failureThreshold=6 \
            --liveness-probe=grpc.port=8080,initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=30,failureThreshold=3 \
            --update-env-vars "\
              NODE_ENV=production,\
              SERVICE_MODE=grpc,\
              DEPLOY_ENVIRONMENT=${ENVIRONMENT},\
              FRONTEND_URL=${FRONTEND_URL},\
              GITHUB_SERVICE_INTERNAL_SECRET=${{ secrets.CODESENTRY_INTERNAL_SECRET }},\
              WEBHOOK_SECRET=${{ secrets.CODESENTRY_WEBHOOK_SECRET }}" \
            --set-secrets "\
              DATABASE_URL=codesentry-database-url${SECRET_SUFFIX}:latest,\
              GITHUB_APP_ID=codesentry-github-app${SECRET_SUFFIX}-id:latest,\
              GITHUB_APP_PRIVATE_KEY=codesentry-github-app${SECRET_SUFFIX}-private-key:latest" \
            --no-allow-unauthenticated

      - name: Grant API access to GitHub gRPC service
        shell: bash
        run: |
          set -euo pipefail
          API_INVOKER="${{ vars.CODESENTRY_API_RUNTIME_SERVICE_ACCOUNT }}"
          if [ -z "$API_INVOKER" ]; then
            PROJECT_NUMBER=$(gcloud projects describe '${{ vars.GCP_PROJECT_ID }}' --format='value(projectNumber)')
            API_INVOKER="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --member="serviceAccount:${API_INVOKER}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Verify GitHub service URL
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format='value(status.url)'
