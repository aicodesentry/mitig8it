# Freshening a branch is only worth a push when something is waiting on it.
#
# This used to run hourly, and again after every CI success on main, updating every open
# pull request each time. Each of those updates is a `github-actions[bot]` merge commit, and
# this repository holds the workflow runs of a new head for manual approval, so every push
# left its pull request reporting no checks until an owner went and approved the run. The
# workflow written to keep branches mergeable was the reason none of them could report.
# It was also buying nothing: main carries no branch protection and no "require branches to
# be up to date" rule, so there was no requirement for the freshness to satisfy.
#
# What is left is the case that still earns the push. After CI passes on main, only the pull
# requests labelled `ready-to-merge` are updated, because that label is a person saying this
# one is about to land and wants it current. `workflow_dispatch` keeps the old behaviour and
# updates every open pull request, for the deliberate bulk refresh after a large change on
# main. The hourly cron is gone.
#
# Pull requests from forks are skipped either way. `gh pr update-branch` writes to the head
# repository, which this token cannot do.
name: Auto-update PR branches

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update-pr-branches:
    name: Update open PR branches
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Update same-repository PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Empty means every open pull request, which is what a manual run asks for. The
          # automatic run after CI on main narrows the list to one label.
          LABEL_FILTER: ${{ github.event_name == 'workflow_run' && 'ready-to-merge' || '' }}
        run: |
          set -euo pipefail

          # The label is matched here rather than passed to `gh pr list --label`, which
          # fails outright when the label does not exist in the repository yet.
          prs="$(gh pr list \
            --repo "$REPO" \
            --base main \
            --state open \
            --json number,isCrossRepository,labels \
            | jq -r --arg label "$LABEL_FILTER" \
                '.[]
                 | select(.isCrossRepository == false)
                 | select($label == "" or ([.labels[].name] | index($label)))
                 | .number')"

          if [ -z "$prs" ]; then
            if [ -n "$LABEL_FILTER" ]; then
              echo "No same-repository pull request carries the $LABEL_FILTER label."
            else
              echo "No same-repository pull requests need updating."
            fi
            exit 0
          fi

          for pr in $prs; do
            echo "Updating PR #$pr with the latest main branch."
            if ! gh pr update-branch "$pr" --repo "$REPO"; then
              echo "::warning::Could not update PR #$pr. It may already be current, have conflicts, or be temporarily locked by another workflow."
            fi
          done
