name: Deploy API (Cloud Run)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudrun-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  filter:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Path filter
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git rev-parse HEAD^)
          if git diff --name-only "$BASE" HEAD | grep -qE '^(services/api-service/|proto/|\.github/workflows/deploy-api-cloudrun\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: filter
    if: needs.filter.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Authenticate to Google Cloud (service account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Reset Docker auth
        run: |
          rm -f "$HOME/.docker/config.json"
          docker logout docker.io || true
          docker logout registry-1.docker.io || true

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Load API migration secrets
        run: |
          echo "DATABASE_URL=$(gcloud secrets versions access latest --secret=codesentry-database-url | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Set release metadata
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          SHORT="${DEPLOY_SHA:0:12}"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:api-${SHORT}" >> "$GITHUB_ENV"

      - name: Build API image
        run: |
          docker build -f ./services/api-service/Dockerfile.prod -t "$IMAGE" ./services/api-service

      - name: Assert migrations are in the release image
        run: |
          docker run --rm "$IMAGE" sh -c 'ls migrations/*.sql'

      - name: Push API image
        run: |
          docker push "$IMAGE"

      - name: Run API migrations from release image
        env:
          NODE_ENV: production
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV="$NODE_ENV" \
            "$IMAGE" \
            npm run db:migrate

      - name: Deploy API
        run: |
          gcloud run deploy codesentry-api \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --platform managed \
            --update-env-vars "\
              NODE_ENV=production,\
              FRONTEND_URL=${{ vars.CODESENTRY_FRONTEND_URL }},\
              GITHUB_SERVICE_URL=${{ vars.CODESENTRY_GH_SERVICE_URL }},\
              ANALYSIS_SERVICE_URL=${{ vars.CODESENTRY_ANALYSIS_URL }},\
              INTERNAL_SERVICE_TRANSPORT=grpc,\
              GRPC_TRANSPORT_TLS=true,\
              GITHUB_GRPC_URL=${{ vars.CODESENTRY_GH_SERVICE_URL }},\
              GITHUB_GRPC_AUDIENCE=${{ vars.CODESENTRY_GH_SERVICE_URL }},\
              ANALYSIS_GRPC_URL=${{ vars.CODESENTRY_ANALYSIS_URL }},\
              ANALYSIS_GRPC_AUDIENCE=${{ vars.CODESENTRY_ANALYSIS_URL }},\
              GITHUB_CALLBACK_URL=${{ vars.CODESENTRY_FRONTEND_URL }}/auth/github/callback,\
              GITHUB_APP_SLUG=mitig8it,\
              GITHUB_SERVICE_INTERNAL_SECRET=${{ secrets.CODESENTRY_INTERNAL_SECRET }}" \
            --set-secrets "\
              JWT_SECRET=codesentry-jwt-secret:latest,\
              ENCRYPTION_KEY=codesentry-encryption-key:latest,\
              DATABASE_URL=codesentry-database-url:latest,\
              GITHUB_APP_ID=codesentry-github-app-id:latest,\
              GITHUB_APP_PRIVATE_KEY=codesentry-github-app-private-key:latest,\
              GITHUB_WEBHOOK_SECRET=codesentry-webhook-secret:latest,\
              GITHUB_CLIENT_ID=codesentry-github-client-id:latest,\
              GITHUB_CLIENT_SECRET=codesentry-github-client-secret:latest,\
              REMEDIATION_SERVICE_INTERNAL_SECRET=codesentry-remediation-internal-secret:latest" \
            --allow-unauthenticated

      - name: Smoke (Cloud Run URL → /health)
        shell: bash
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe codesentry-api \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format='value(status.url)')
          curl -sfS --connect-timeout 15 --max-time 45 "${URL}/health"
