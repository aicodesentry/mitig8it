name: Deploy API (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [production, staging]
        default: production
      api_min_instances:
        description: >-
          Instances kept warm. 1 keeps the first review after an idle period off the
          cold-start path; see docs/deployment/cloud-run-firebase.md for the cost.
        type: string
        default: '1'
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      api_min_instances:
        type: string
        default: '1'
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Staging and production are separate services and must not queue behind each other.
  group: cloudrun-deploy-${{ github.workflow }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.ref != ''
      || (inputs.environment == 'production' && github.ref == 'refs/heads/main')
      || (inputs.environment == 'staging' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Everything downstream reads $SERVICE, $SECRET_SUFFIX and the resolved URLs, so
      # the difference between production and staging lives in exactly one step.
      - name: Enforce quality evidence before shipping
        uses: ./.github/actions/quality-readiness
        with:
          environment: ${{ inputs.environment || 'production' }}
          component: all

      - name: Resolve environment
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          case "$ENVIRONMENT" in
            production)
              SUFFIX=""
              FRONTEND_URL='${{ vars.CODESENTRY_FRONTEND_URL }}'
              GH_SERVICE_URL='${{ vars.CODESENTRY_GH_SERVICE_URL }}'
              ANALYSIS_URL='${{ vars.CODESENTRY_ANALYSIS_URL }}'
              ;;
            staging)
              SUFFIX="-staging"
              FRONTEND_URL='${{ vars.CODESENTRY_FRONTEND_URL_STAGING }}'
              GH_SERVICE_URL='${{ vars.CODESENTRY_GH_SERVICE_URL_STAGING }}'
              ANALYSIS_URL='${{ vars.CODESENTRY_ANALYSIS_URL_STAGING }}'
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          # A staging deploy that silently fell back to the production URLs would point
          # the staging API at production. Refuse instead.
          for name in FRONTEND_URL GH_SERVICE_URL ANALYSIS_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable for $name in the $ENVIRONMENT environment" >&2
              exit 1
            fi
          done
          {
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "SECRET_SUFFIX=$SUFFIX"
            echo "SERVICE=codesentry-api${SUFFIX}"
            echo "FRONTEND_URL=$FRONTEND_URL"
            echo "GH_SERVICE_URL=$GH_SERVICE_URL"
            echo "ANALYSIS_URL=$ANALYSIS_URL"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Authenticate to Google Cloud (service account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'

      - name: Reset Docker auth
        run: |
          rm -f "$HOME/.docker/config.json"
          docker logout docker.io || true
          docker logout registry-1.docker.io || true

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Load separate API migration and runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_MIGRATION_URL=$(gcloud secrets versions access latest --secret="codesentry-database-url${SECRET_SUFFIX}" | tr -d '\n')
          DATABASE_URL=$(gcloud secrets versions access latest --secret="codesentry-database-runtime-url${SECRET_SUFFIX}" | tr -d '\n')
          if [ -z "$DATABASE_MIGRATION_URL" ] || [ -z "$DATABASE_URL" ]; then
            echo "The migration or runtime database credential resolved to an empty value" >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_MIGRATION_URL"
          echo "::add-mask::$DATABASE_URL"
          {
            echo "DATABASE_MIGRATION_URL=$DATABASE_MIGRATION_URL"
            echo "DATABASE_URL=$DATABASE_URL"
          } >> "$GITHUB_ENV"

      - name: Set release metadata
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ inputs.ref || github.sha }}"
          SHORT="${DEPLOY_SHA:0:12}"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:api-${SHORT}" >> "$GITHUB_ENV"

      - name: Build API image
        run: |
          docker build -f ./services/api-service/Dockerfile.prod -t "$IMAGE" ./services/api-service

      - name: Assert migrations are in the release image
        run: |
          docker run --rm "$IMAGE" sh -c 'ls migrations/*.sql'

      - name: Push API image
        run: |
          docker push "$IMAGE"

      # Migrations run before the deploy and they are forward-only: no down migration
      # exists anywhere in this repository, and docs/runbooks/rollback.md section 5 is
      # about what that costs. Staging the revision below lengthens the window in which
      # the new schema is live while the OLD revision is still serving, because the
      # candidate now has to pass its checks before it gets any traffic. That window is
      # not new, it is longer, and it is the trade this file is making on purpose: the
      # alternative is the bad revision serving immediately on top of the same
      # irreversible schema. An additive migration is invisible to the old revision; one
      # that drops or tightens something the old revision reads is not, and that is a
      # thing to settle when the migration is reviewed, not when the deploy is running.
      - name: Run API migrations from release image
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e NODE_ENV \
            "$IMAGE" \
            npm run db:migrate

      - name: Provision and verify least-privilege runtime role
        env:
          NODE_ENV: production
        run: |
          docker run --rm \
            -e DATABASE_MIGRATION_URL \
            -e DATABASE_URL \
            -e NODE_ENV \
            "$IMAGE" \
            npm run db:provision-runtime
          docker run --rm \
            -e DATABASE_URL \
            -e NODE_ENV \
            "$IMAGE" \
            npm run db:verify-runtime

      # Where traffic points right now, so the promote below has somewhere to put it
      # back. The entry that actually carries traffic, not the newest revision: after a
      # promote that failed halfway those are different revisions.
      - name: Record the serving revision
        shell: bash
        run: |
          set -euo pipefail
          # Existence is read from a list and not from a failing describe, because describe
          # fails the same way for a service that is absent and for a credential that
          # cannot read it, and reading the second as a first deploy would quietly send
          # this revision straight to traffic with no gate at all.
          gcloud run services list \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format='value(metadata.name)' > "$RUNNER_TEMP/services.txt"
          if ! grep -Fxq "$SERVICE" "$RUNNER_TEMP/services.txt"; then
            # deploy-staging.yml creates services from scratch, and --no-traffic on a
            # service with no other revision would leave it serving nothing at all, so a
            # first deploy takes traffic the way every deploy used to and has no promote
            # step to reach.
            {
              echo "FIRST_DEPLOY=true"
              echo "PREVIOUS_REVISION="
            } >> "$GITHUB_ENV"
            echo "$SERVICE does not exist yet. It is created serving, and smoked afterwards."
            exit 0
          fi
          gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json > "$RUNNER_TEMP/service-before.json"
          PREVIOUS_REVISION=$(jq -r '
            [.status.traffic[]? | select(.revisionName != null and (.percent // 0) > 0)]
            | sort_by(.percent) | last | .revisionName // ""' "$RUNNER_TEMP/service-before.json")
          {
            echo "FIRST_DEPLOY=false"
            echo "PREVIOUS_REVISION=$PREVIOUS_REVISION"
          } >> "$GITHUB_ENV"
          echo "$SERVICE is serving ${PREVIOUS_REVISION:-no revision this job can name}."

      # Two containers in one instance. The application serves ingress; the managed
      # Prometheus sidecar scrapes the loopback metrics listener every 30 seconds and
      # writes the series to Cloud Monitoring, which is what the alert policies read.
      # The sidecar holds no internal secret, which is why the loopback listener exists.
      - name: Deploy API
        shell: bash
        run: |
          set -euo pipefail
          MIN_INSTANCES="${{ inputs.api_min_instances || '1' }}"
          # The managed Prometheus sidecar is opt-in through the METRICS_SIDECAR_ENABLED
          # repository variable. It needs the codesentry-gmp-config secret, which is an
          # owner step in docs/runbooks/observability.md; without the variable the service
          # deploys as the single container it always was, so a missing secret cannot
          # block a production deploy. The application container keeps the name Cloud Run
          # gave the existing service (api-1): gcloud merges containers by name, and a new
          # name would leave two containers exposing a port, which Cloud Run refuses.
          SIDECAR="${{ vars.METRICS_SIDECAR_ENABLED || 'false' }}"
          ENV_VARS="\
            NODE_ENV=production,\
            DEPLOY_ENVIRONMENT=${ENVIRONMENT},\
            METRICS_LOOPBACK_ENABLED=${SIDECAR},\
            METRICS_LOOPBACK_PORT=9091,\
            FRONTEND_URL=${FRONTEND_URL},\
            GITHUB_SERVICE_URL=${GH_SERVICE_URL},\
            ANALYSIS_SERVICE_URL=${ANALYSIS_URL},\
            INTERNAL_SERVICE_TRANSPORT=grpc,\
            GRPC_TRANSPORT_TLS=true,\
            GITHUB_GRPC_URL=${GH_SERVICE_URL},\
            GITHUB_GRPC_AUDIENCE=${GH_SERVICE_URL},\
            ANALYSIS_GRPC_URL=${ANALYSIS_URL},\
            ANALYSIS_GRPC_AUDIENCE=${ANALYSIS_URL},\
            GITHUB_CALLBACK_URL=${FRONTEND_URL}/auth/github/callback,\
            GITHUB_APP_SLUG=mitig8it"
          if [ "$ENVIRONMENT" = 'production' ]; then
            APPROVED_SERVICE=$(python -c 'import json; print(json.load(open("services/api-service/src/quality-release.json"))["service"]["image_digest"])')
            APPROVED_SANDBOX=$(python -c 'import json; print(json.load(open("services/api-service/src/quality-release.json"))["sandbox"]["image_digest"])')
            ENV_VARS="${ENV_VARS},REMEDIATION_SERVICE_IMAGE_DIGEST=${APPROVED_SERVICE},REMEDIATION_SANDBOX_IMAGE_DIGEST=${APPROVED_SANDBOX}"
          fi
          SECRETS="\
            JWT_SECRET=codesentry-jwt-secret${SECRET_SUFFIX}:latest,\
            ENCRYPTION_KEY=codesentry-encryption-key${SECRET_SUFFIX}:latest,\
            DATABASE_URL=codesentry-database-runtime-url${SECRET_SUFFIX}:latest,\
            GITHUB_APP_ID=codesentry-github-app${SECRET_SUFFIX}-id:latest,\
            GITHUB_APP_PRIVATE_KEY=codesentry-github-app${SECRET_SUFFIX}-private-key:latest,\
            GITHUB_WEBHOOK_SECRET=codesentry-webhook-secret${SECRET_SUFFIX}:latest,\
            GITHUB_CLIENT_ID=codesentry-github-client${SECRET_SUFFIX}-id:latest,\
            GITHUB_CLIENT_SECRET=codesentry-github-client${SECRET_SUFFIX}-secret:latest,\
            GITHUB_SERVICE_INTERNAL_SECRET=codesentry-internal-secret${SECRET_SUFFIX}:latest,\
            ANALYSIS_SERVICE_INTERNAL_SECRET=codesentry-internal-secret${SECRET_SUFFIX}:latest,\
            REMEDIATION_SERVICE_INTERNAL_SECRET=codesentry-remediation-internal-secret${SECRET_SUFFIX}:latest"
          COMMON=(
            --region "${{ vars.GCP_REGION }}"
            --no-cpu-throttling
            --project "${{ vars.GCP_PROJECT_ID }}"
            --platform managed
            --min-instances "$MIN_INSTANCES"
            --allow-unauthenticated
          )
          # The revision is created without traffic and reachable only through the
          # `candidate` tag, so the checks below run against the new code before anybody
          # is served by it. This is not about a revision that cannot start: gcloud
          # already waits for Ready and fails the deploy without moving traffic. It is
          # about the application-level checks, which until now ran after the fact. The
          # tag is the literal string `candidate` in every service, so it never
          # accumulates: each deploy replaces it and the promote removes it.
          if [ "$FIRST_DEPLOY" != "true" ]; then
            COMMON+=(--no-traffic --tag candidate)
          fi
          if [ "$SIDECAR" = "true" ]; then
            gcloud run deploy "$SERVICE" "${COMMON[@]}" \
              --container api-1 \
                --image "$IMAGE" \
                --port 3000 \
                --update-env-vars "$ENV_VARS" \
                --set-secrets "$SECRETS" \
              --container collector \
                --image us-docker.pkg.dev/cloud-ops-agents-artifacts/cloud-run-gmp-sidecar/cloud-run-gmp-sidecar:1.1.1 \
                --set-secrets "/etc/rungmp/config.yaml=codesentry-gmp-config:latest"
          else
            gcloud run deploy "$SERVICE" "${COMMON[@]}" \
              --image "$IMAGE" \
              --port 3000 \
              --update-env-vars "$ENV_VARS" \
              --set-secrets "$SECRETS"
          fi
          # One config secret serves both environments: the scrape target is the same
          # loopback port either way, and the series are separated by the Cloud Run
          # service name that Managed Prometheus attaches as a resource label.

      # Everything below this point reads the candidate, never the service URL and never
      # the service's latest template, because the service still answers from the old
      # revision until the promote. On a first deploy there is no tag and the service URL
      # is the new revision, which is the same thing.
      - name: Resolve the candidate
        shell: bash
        run: |
          set -euo pipefail
          DESCRIBED=$(gcloud run services describe "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format=json)
          if [ "$FIRST_DEPLOY" = "true" ]; then
            CANDIDATE_REVISION=$(jq -r '.status.latestCreatedRevisionName // ""' <<<"$DESCRIBED")
            SMOKE_URL=$(jq -r '.status.url // ""' <<<"$DESCRIBED")
          else
            # Read the revision out of the tag itself rather than trusting
            # latestCreatedRevisionName, so the checks and the name they report are the
            # same revision the tag resolves to.
            CANDIDATE=$(jq -c '
              [.status.traffic[]? | select(.tag == "candidate")] | first // {}
            ' <<<"$DESCRIBED")
            CANDIDATE_REVISION=$(jq -r '.revisionName // ""' <<<"$CANDIDATE")
            SMOKE_URL=$(jq -r '.url // ""' <<<"$CANDIDATE")
          fi
          if [ -z "$SMOKE_URL" ] || [ -z "$CANDIDATE_REVISION" ]; then
            echo "Could not resolve the candidate for $SERVICE: url='${SMOKE_URL}' revision='${CANDIDATE_REVISION}'." >&2
            echo "Traffic has not been moved. See docs/runbooks/rollback.md." >&2
            exit 1
          fi
          {
            echo "CANDIDATE_REVISION=$CANDIDATE_REVISION"
            echo "SMOKE_URL=$SMOKE_URL"
          } >> "$GITHUB_ENV"
          echo "Candidate $CANDIDATE_REVISION at $SMOKE_URL"

      - name: Smoke the candidate (candidate URL → /health)
        shell: bash
        run: |
          set -euo pipefail
          # codesentry-api is deployed --allow-unauthenticated, and a tag URL answers
          # under the same IAM policy as the service, so a plain curl reaches it.
          curl -sfS --connect-timeout 15 --max-time 45 "${SMOKE_URL}/health"

      # A scrape that silently stopped is the failure mode the stall alert cannot see on
      # its own, so the deploy asserts the sidecar is present. Against the candidate
      # revision by name, not the service's latest template: the template is what was
      # asked for, the revision is what exists, and only the revision can be wrong in a
      # way worth failing a deploy over.
      - name: Assert the metrics sidecar is in the candidate revision
        if: vars.METRICS_SIDECAR_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CONTAINERS=$(gcloud run revisions describe "$CANDIDATE_REVISION" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --format='value(spec.containers[].name)')
          echo "Containers in $CANDIDATE_REVISION: $CONTAINERS"
          case "$CONTAINERS" in
            *collector*) ;;
            *) echo "The managed Prometheus sidecar is missing from $CANDIDATE_REVISION" >&2; exit 1 ;;
          esac

      # Reached only when a check above failed. Traffic never moved, so there is nothing
      # to undo and this step changes nothing; it says where the bad revision is.
      - name: Report a candidate that failed its checks
        if: failure() && env.FIRST_DEPLOY == 'false' && env.CANDIDATE_REVISION != ''
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "A check against the candidate revision failed. Traffic was NOT moved."
            echo "Still serving: ${PREVIOUS_REVISION:-unknown}"
            echo "Candidate, serving nobody: ${CANDIDATE_REVISION} at ${SMOKE_URL:-unresolved}"
            echo "The candidate tag is left in place on purpose: it is how you reach that"
            echo "revision to debug it, and the next deploy replaces it."
            echo "See docs/runbooks/rollback.md."
          } | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1

      # Only now, with every check green against the candidate. --to-latest hands it all
      # the traffic and also unpins a service that a rollback left pinned to a named
      # revision, which is the state section 3 of docs/runbooks/rollback.md warns leaves
      # deploys looking green while serving old code.
      - name: Promote the candidate
        if: env.FIRST_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services update-traffic "$SERVICE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --to-latest --remove-tags candidate; then
            exit 0
          fi
          # A promote that failed partway can leave traffic split across two revisions,
          # which is worse than either end of it, so put it back where it was.
          echo "Promoting ${CANDIDATE_REVISION} failed." >&2
          if [ -n "${PREVIOUS_REVISION}" ]; then
            echo "Returning all traffic to ${PREVIOUS_REVISION}." >&2
            gcloud run services update-traffic "$SERVICE" \
              --region '${{ vars.GCP_REGION }}' \
              --project '${{ vars.GCP_PROJECT_ID }}' \
              --to-revisions "${PREVIOUS_REVISION}=100" \
              || echo "That failed too. Traffic may be split right now: docs/runbooks/rollback.md section 3." >&2
          else
            echo "No previous revision was recorded, so traffic is left as it is: docs/runbooks/rollback.md section 3." >&2
          fi
          exit 1
