name: Dependabot auto-merge

# Auto-merges low-risk Dependabot PRs once Required CI passes.
# Ungrouped major version bumps are skipped so they get a human review. Grouped
# PRs configured as *-patches or *-minors are allowed even when Dependabot marks
# the overall PR as semver-major due to transitive lockfile movement.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # Pinned to the commit `v3` pointed at, because `cwe-1357.gha-third-party-action-unpinned`
        # is this repository's own rule and a tag its owner can move is what the rule is about.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge eligible updates after Required CI
        if: |
          steps.meta.outputs.update-type != 'version-update:semver-major'
          || endsWith(steps.meta.outputs.dependency-group, '-patches')
          || endsWith(steps.meta.outputs.dependency-group, '-minors')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Prefer a PAT so Dependabot merges can trigger normal push/workflow_run
          # pipelines. Falls back to GITHUB_TOKEN when the secret is not configured.
          GH_TOKEN: ${{ secrets.GH_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            required_ci="$(gh pr view "$PR_URL" \
              --json statusCheckRollup \
              --jq '.statusCheckRollup[]? | select(.name == "Required CI") | "\(.status) \(.conclusion)"' \
              | tail -n 1)"

            case "$required_ci" in
              "COMPLETED SUCCESS")
                echo "Required CI passed."
                break
                ;;
              "COMPLETED FAILURE"|"COMPLETED CANCELLED"|"COMPLETED TIMED_OUT"|"COMPLETED ACTION_REQUIRED"|"COMPLETED SKIPPED")
                echo "Required CI did not pass: $required_ci"
                exit 1
                ;;
              *)
                echo "Waiting for Required CI (${attempt}/60): ${required_ci:-not reported yet}"
                sleep 10
                ;;
            esac

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for Required CI."
              exit 1
            fi
          done

          gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"
