name: Action image

on:
  pull_request:
    paths:
      - 'action/**'
      - 'services/analysis-service/**'
      - 'services/remediation-service/**'
      - 'services/github-service/**'
      - '.github/workflows/action-build.yml'
  push:
    branches: [main]

# The image is built to prove it builds. It is never pushed anywhere, so this workflow needs
# nothing beyond reading the code.
permissions:
  contents: read

concurrency:
  group: action-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: Orchestrator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      # The parity tests compare the ported filters against the Node sources, and one of them
      # runs the Node implementation, so both toolchains are present here. The tests that need
      # the services themselves skip in this job and run inside the image below.
      - name: Install the test dependencies
        run: pip install pytest httpx pyyaml
      - name: Run the tests
        run: pytest tests -q
        working-directory: action

  image:
    name: Build the container and run its tests inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # Built exactly as the composite action builds it: the repository root is the context,
      # because the image bundles the services the action drives. Building it any other way
      # here would test a path no user takes.
      - name: Build the image
        run: |
          start="$(date +%s)"
          docker build --file action/Dockerfile --tag mitig8it-action:ci .
          echo "Image built in $(( $(date +%s) - start ))s."

      - name: Report the image size
        run: |
          docker image inspect mitig8it-action:ci --format '{{ .Size }}' \
            | awk '{ printf "image size: %.0f MB\n", $1 / 1048576 }'

      - name: Run the unit tests inside the image
        run: |
          docker run --rm --entrypoint sh mitig8it-action:ci -c \
            'pip install --no-cache-dir --quiet pytest && cd /opt/mitig8it/action && pytest tests -q'

      - name: The scanner and both runtimes are present
        run: |
          docker run --rm --entrypoint semgrep mitig8it-action:ci --version
          docker run --rm --entrypoint node mitig8it-action:ci --version
          docker run --rm --entrypoint python mitig8it-action:ci --version

      # The permission refusal is the action's central claim, so it is exercised against the
      # real entrypoint rather than only against the function that implements it. No token is
      # supplied, so the run must stop before it reaches GitHub.
      - name: The entrypoint refuses to run without a token
        run: |
          set +e
          output="$(docker run --rm \
            --env GITHUB_REPOSITORY=acme/widgets \
            mitig8it-action:ci 2>&1)"
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -eq 0 ]; then
            echo "the entrypoint exited 0 with no token, which it must never do" >&2
            exit 1
          fi

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # A workflow file that does not parse fails the whole run before any job starts, with a
      # message that does not say which file or line. This job says both.
      - name: Run actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
