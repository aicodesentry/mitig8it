name: Remediation safety checks

on:
  workflow_dispatch:
    inputs:
      release_gate:
        description: 'Run the non-deploying remediation release-evidence gate; it succeeds only with the full reviewed corpus.'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - 'benchmarks/remediation/**'
      - 'services/remediation-service/**'
      - 'services/api-service/src/services/remediation*.js'
      - 'services/api-service/src/workers/**'
      - 'services/api-service/src/routes/remediation.js'
      - 'services/api-service/src/clients/**'
      - 'services/api-service/src/utils/telemetry.js'
      - 'services/github-service/src/services/githubInternalOperations.js'
      - 'services/github-service/src/routes/internal.js'
      - 'infrastructure/remediation/**'
      - 'docs/runbooks/remediation.md'
      - '.github/workflows/remediation.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/remediation/**'
      - 'services/remediation-service/**'
      - 'services/api-service/src/services/remediation*.js'
      - 'services/api-service/src/workers/**'
      - 'services/api-service/src/routes/remediation.js'
      - 'services/api-service/src/clients/**'
      - 'services/api-service/src/utils/telemetry.js'
      - 'services/github-service/src/services/githubInternalOperations.js'
      - 'services/github-service/src/routes/internal.js'
      - 'infrastructure/remediation/**'
      - 'docs/runbooks/remediation.md'
      - '.github/workflows/remediation.yml'

permissions:
  contents: read

# Python 3.12 matches services/remediation-service/Dockerfile (python:3.12.12-slim).
# Frontend remediation coverage is not filtered here: npm run test:remediation-browser
# runs on every pull request in the CI workflow.
jobs:
  remediation-service-tests:
    name: Repair service unit and broker contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/remediation-service/requirements-test.txt
      - run: pip install -r services/remediation-service/requirements-test.txt
      # The static assertion level is decided by re-running the rule that produced the finding,
      # and `tests/test_static_assertion_engine.py` drives the real oracle rather than a stub, so
      # this job needs the analysis service's scanner. It cannot go in the test environment:
      # semgrep requires opentelemetry-api~=1.37.0 and this service pins ==1.44.0, the conflict
      # `action/requirements.txt` is written around. The oracle shells out to the binary, so a
      # separate virtualenv with only `semgrep` linked onto PATH gives the tests the real scanner
      # without moving a pin. The version is read out of the analysis service's own requirements
      # rather than restated, so this can never verify against a scanner that service does not run.
      - name: Install the scanner the rule oracle runs, beside the test environment
        run: |
          set -euo pipefail
          version="$(sed -n 's/^semgrep==\(.*\)$/\1/p' services/analysis-service/src/requirements.txt | head -n 1)"
          if [ -z "${version}" ]; then
            echo "services/analysis-service/src/requirements.txt no longer pins semgrep" >&2
            exit 1
          fi
          python -m venv /tmp/rule-scanner
          /tmp/rule-scanner/bin/pip install --disable-pip-version-check "semgrep==${version}"
          # Only the scanner is exposed. Putting the whole virtualenv on PATH would shadow this
          # job's own python and pip, which belong to the test environment.
          mkdir -p /tmp/rule-scanner-bin
          ln -sf /tmp/rule-scanner/bin/semgrep /tmp/rule-scanner-bin/semgrep
          echo "/tmp/rule-scanner-bin" >> "$GITHUB_PATH"
      # A guard rather than a courtesy. The oracle reports itself unavailable when either half is
      # missing and its tests then skip, so a job that lost the scanner would go green having
      # tested nothing. This asks the same question the test fixture asks, before pytest runs.
      - name: The rule oracle must be available here, so its tests run rather than skip
        run: |
          set -euo pipefail
          semgrep --version
          python - <<'PY'
          import sys
          sys.path.insert(0, "services/remediation-service")
          from src.verification.static_assertion import InProcessRuleOracle
          reason = InProcessRuleOracle.unavailable_reason()
          if reason is not None:
              sys.exit(f"the static assertion tests would skip in this job: {reason}")
          PY
      - run: pytest services/remediation-service/tests -q

  remediation-evaluation:
    name: Offline remediation fixture gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/remediation-service/requirements.txt
      # The fixture gate runs the sandbox test harness on this runner, and the harness needs the
      # Node features the service image ships (module.stripTypeScriptTypes, registerHooks). The
      # version is read out of the Dockerfile rather than restated here, so the gate can never
      # verify on a runtime the service does not run on.
      - name: Read the sandbox Node version from the service Dockerfile
        id: sandbox-node
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG NODE_VERSION=\(.*\)$/\1/p' services/remediation-service/Dockerfile | head -n 1)"
          if [ -z "${version}" ]; then
            echo "services/remediation-service/Dockerfile no longer declares ARG NODE_VERSION" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ steps.sandbox-node.outputs.version }}
      # The fixture gate imports the remediation service in-process, so it needs
      # the service runtime dependencies (pydantic, fastapi, httpx, ...).
      - run: pip install -r services/remediation-service/requirements.txt
      - run: python -m unittest benchmarks.remediation.tests.test_evaluate
      - run: python benchmarks/remediation/evaluate.py --suite seed --output /tmp/remediation-seed.json
      - name: Evaluate release evidence without deploying
        env:
          RELEASE_GATE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate || 'false' }}
        run: |
          if [ "$RELEASE_GATE_REQUESTED" = "true" ]; then
            # This only validates evidence; it neither enables flags nor deploys.
            python benchmarks/remediation/evaluate.py --suite release --output /tmp/remediation-release.json
          else
            set +e
            python benchmarks/remediation/evaluate.py --suite release --output /tmp/remediation-release.json
            evaluation_exit_code=$?
            set -e
            test "$evaluation_exit_code" -eq 2
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remediation-evaluation-reports
          path: /tmp/remediation-*.json

  remediation-infrastructure-validation:
    name: Remediation infrastructure syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.11.3'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: terraform fmt -check -recursive infrastructure/remediation/terraform
      - run: terraform -chdir=infrastructure/remediation/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/remediation/terraform validate
      - name: Render deployable Kubernetes template with non-production values
        run: |
          python infrastructure/remediation/render_kubernetes.py \
            --output /tmp/remediation-kubernetes \
            --remediation-service-image registry.example/mitig8it/remediation@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --remediation-worker-image registry.example/mitig8it/remediation@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --sandbox-broker-image registry.example/mitig8it/remediation@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --otel-collector-image registry.example/otel/collector@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --remediation-api-gcp-service-account remediation-api-art-staging@example-project.iam.gserviceaccount.com \
            --remediation-worker-gcp-service-account remediation-worker-art-staging@example-project.iam.gserviceaccount.com \
            --kubernetes-api-cidr 10.0.0.0/28 \
            --remediation-external-egress-cidr 10.1.0.0/28 \
            --remediation-database-cidr 10.2.0.0/28
          kubectl kustomize /tmp/remediation-kubernetes >/tmp/remediation-kubernetes.yaml
      - name: Parse all remediation YAML
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path("infrastructure/remediation").rglob("*.yaml"):
              list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          list(yaml.safe_load_all(Path("/tmp/remediation-kubernetes.yaml").read_text(encoding="utf-8")))
          PY
