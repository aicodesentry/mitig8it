syntax = "proto3";

package mitig8it.analysis.v1;

import "common.proto";

service AnalysisService {
  rpc AnalyzePullRequest(AnalyzePullRequestRequest) returns (AnalyzePullRequestResponse);
  rpc AnalyzeTier1(AnalyzePullRequestRequest) returns (AnalyzePullRequestResponse);
  rpc AnalyzeTier2(AnalyzePullRequestRequest) returns (AnalyzePullRequestResponse);
  rpc TriageFindings(TriageFindingsRequest) returns (TriageFindingsResponse);
  rpc HealthCheck(mitig8it.common.v1.HealthCheckRequest) returns (mitig8it.common.v1.HealthCheckResponse);
}

message AnalyzePullRequestRequest {
  string repository_full_name = 1;
  int32 pull_request_number = 2;
  string commit_sha = 3;
  repeated mitig8it.common.v1.ChangedFile files = 4;
}

message AnalyzePullRequestResponse {
  string repository_full_name = 1;
  int32 pull_request_number = 2;
  string commit_sha = 3;
  int32 files_analyzed = 4;
  int32 tier = 5;
  repeated mitig8it.common.v1.Finding findings = 6;
  repeated mitig8it.common.v1.AnalysisLimitation analysis_limitations = 7;
}

message TriageFindingsRequest {
  string repository_full_name = 1;
  int32 pull_request_number = 2;
  string commit_sha = 3;
  repeated mitig8it.common.v1.Finding findings = 4;
  map<string, string> file_patches = 5;
  mitig8it.common.v1.RepoProfile repo_profile = 6;
}

message TriageFindingsResponse {
  string repository_full_name = 1;
  int32 pull_request_number = 2;
  string commit_sha = 3;
  int32 tier = 4;
  repeated mitig8it.common.v1.Finding findings = 5;
  int32 filtered_count = 6;
}
