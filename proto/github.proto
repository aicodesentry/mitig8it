syntax = "proto3";

package mitig8it.github.v1;

import "common.proto";

service GitHubService {
  rpc FetchPullRequestFiles(FetchPullRequestFilesRequest) returns (FetchPullRequestFilesResponse);
  rpc FetchFileContents(FetchFileContentsRequest) returns (FetchFileContentsResponse);
  rpc SubmitPullRequestReview(SubmitPullRequestReviewRequest) returns (SubmitPullRequestReviewResponse);
  rpc PostInlineComment(PostInlineCommentRequest) returns (PostInlineCommentResponse);
  rpc RetireInlineComments(RetireInlineCommentsRequest) returns (RetireInlineCommentsResponse);
  rpc CreateCheckRun(CreateCheckRunRequest) returns (CreateCheckRunResponse);
  rpc SnapshotRemediation(RemediationSnapshotRequest) returns (RemediationSnapshotResponse);
  rpc CreateRemediationCheckRun(RemediationCheckRunRequest) returns (RemediationCheckRunResponse);
  rpc PublishRemediationComment(RemediationCommentRequest) returns (RemediationCommentResponse);
  rpc PublishFindingFixSections(FindingFixSectionsRequest) returns (FindingFixSectionsResponse);
  rpc HealthCheck(mitig8it.common.v1.HealthCheckRequest) returns (mitig8it.common.v1.HealthCheckResponse);
}

message FetchPullRequestFilesRequest {
  string repository_full_name = 1;
  int32 pull_request_number = 2;
  int64 installation_id = 3;
  string commit_sha = 4;
}

// A limitation the analysis run must state rather than hide. `kind` is the machine
// name (today only `file_cap`) and `message` is what the check summary shows. Absent
// when the whole pull request was reviewed.
message AnalysisLimitation {
  string kind = 1;
  string message = 2;
}

message FetchPullRequestFilesResponse {
  repeated mitig8it.common.v1.ChangedFile files = 1;
  AnalysisLimitation limitation = 2;
}

message FetchFileContentsRequest {
  string repository_full_name = 1;
  int64 installation_id = 2;
  string ref = 3;
  repeated string paths = 4;
}

message FileContent {
  string path = 1;
  string content = 2;
}

message FetchFileContentsResponse {
  repeated FileContent files = 1;
}

message SubmitPullRequestReviewRequest {
  string owner = 1;
  string repo = 2;
  int32 pr_number = 3;
  int64 installation_id = 4;
  string commit_sha = 5;
  string body = 6;
  string event = 7;
  repeated mitig8it.common.v1.ReviewComment comments = 8;
}

message SubmitPullRequestReviewResponse {
  int64 review_id = 1;
  int32 comments_posted = 2;
}

message PostInlineCommentRequest {
  string owner = 1;
  string repo = 2;
  int32 pr_number = 3;
  int64 installation_id = 4;
  string commit_sha = 5;
  string path = 6;
  int32 line = 7;
  string body = 8;
}

message PostInlineCommentResponse {
  int64 comment_id = 1;
  string url = 2;
  bool success = 3;
}

// The inline comments an earlier run posted for findings this run does not annotate,
// named by the fingerprints in their markers. `kept` counts the ones left in place
// because a verified fix was published under them.
message RetireInlineCommentsRequest {
  string owner = 1;
  string repo = 2;
  int32 pr_number = 3;
  int64 installation_id = 4;
  repeated string fingerprints = 5;
}

message RetireInlineCommentsResponse {
  int32 retired = 1;
  int32 kept = 2;
}

message CreateCheckRunRequest {
  string owner = 1;
  string repo = 2;
  int64 installation_id = 3;
  string head_sha = 4;
  string conclusion = 5;
  string title = 6;
  string summary = 7;
}

message CreateCheckRunResponse {
  int64 check_run_id = 1;
}

// Agentic remediation operations. Every request carries the same consent envelope the
// HTTP endpoints validate, so both transports reach one shared operations module.
message RemediationEnvelope {
  string repository_full_name = 1;
  string actor_login = 2;
  int64 installation_id = 3;
  int32 pr_number = 4;
  string head_sha = 5;
  string base_sha = 6;
  string action_id = 7;
  string idempotency_key = 8;
  string manifest_digest = 9;
}

message RemediationSnapshotRequest {
  RemediationEnvelope envelope = 1;
  repeated string finding_paths = 2;
}

message RemediationSourceFile {
  string path = 1;
  string content = 2;
  string sha = 3;
}

message RemediationTreeEntry {
  string path = 1;
  string mode = 2;
  string type = 3;
  string sha = 4;
}

message RemediationSnapshotResponse {
  repeated RemediationSourceFile files = 1;
  repeated RemediationTreeEntry tree_entries = 2;
  string head_tree_oid = 3;
  string head_sha = 4;
  string base_sha = 5;
  repeated string omitted_source_paths = 6;
}

message RemediationCheckRunRequest {
  RemediationEnvelope envelope = 1;
  string head_sha = 2;
  string name = 3;
  string status = 4;
  string conclusion = 5;
  string title = 6;
  string summary = 7;
  string external_id = 8;
}

message RemediationCheckRunResponse {
  string state = 1;
  string operation_id = 2;
  int64 check_run_id = 3;
  string name = 4;
  string external_id = 5;
  bool updated = 6;
  string reason = 7;
}

// One residual report comment per applied action, identified by external_id and
// updated in place when it already exists.
message RemediationCommentRequest {
  RemediationEnvelope envelope = 1;
  string external_id = 2;
  string body = 3;
}

message RemediationCommentResponse {
  string state = 1;
  string operation_id = 2;
  int64 comment_id = 3;
  string external_id = 4;
  bool updated = 5;
  string reason = 6;
}

// Verified fix sections under this app's own inline finding comments. One section per
// candidate and finding, identified by the candidate marker and updated in place; a
// finding without a comment receives one from the section's finding_body.
message FindingFixHunk {
  int32 start_line = 1;
  int32 end_line = 2;
  repeated string original_lines = 3;
  repeated string replacement_lines = 4;
}

message FindingFixSection {
  string candidate_id = 1;
  string finding_fingerprint = 2;
  string path = 3;
  int32 finding_line = 4;
  // Absent when the change is not one contiguous region of the file.
  FindingFixHunk hunk = 5;
  string unified_diff = 6;
  string not_suggestable_reason = 7;
  // The model's own description of the behavior it meant to keep: a hypothesis, not evidence.
  string stated_intent = 8;
  repeated string evidence = 9;
  repeated string limitations = 10;
  // Set for a finding that received no fix; the section is then one line.
  string skipped_reason = 11;
  string verification_level = 12;
  // The rendered finding comment, without its marker, for a finding that has no inline
  // comment yet. The section is then published under a new comment on the finding's line,
  // or in a pull request comment when that line is outside the diff.
  string finding_body = 13;
  // The finding ids this section covers: the proven finding and every finding on the same
  // lines that the same candidate covers.
  repeated string finding_ids = 14;
  // Set for a finding that another finding's candidate covers on the same lines: the rule
  // of the finding whose comment carries the verified fix. The section is then one line.
  string covered_by = 15;
  // What the regression test asserted, in one sentence.
  string proof = 16;
  // The candidate's other contiguous regions of the same file, in file order: an added import
  // on its own line, or a change away from the finding's line. Each becomes a suggestion in a
  // second inline comment when its lines are in the diff.
  repeated FindingFixHunk extra_hunks = 17;
}

message FindingFixSectionsRequest {
  RemediationEnvelope envelope = 1;
  string preview_url = 2;
  repeated FindingFixSection sections = 3;
}

message FindingFixSectionResult {
  string finding_fingerprint = 1;
  string candidate_id = 2;
  int64 comment_id = 3;
  string mode = 4;
  bool updated = 5;
  string reason = 6;
  // True when this publication created the finding comment because none existed.
  bool created = 7;
  // "inline" for a review comment on the finding's line, "pull_request" for a pull
  // request comment used because the line is outside the diff.
  string placement = 8;
}

message FindingFixSectionsResponse {
  string state = 1;
  string operation_id = 2;
  repeated FindingFixSectionResult results = 3;
  string reason = 4;
}
