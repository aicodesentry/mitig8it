# Alert rules for Mitig8it.
#
# There used to be eleven rules here. Six of them queried metric names that nothing
# emitted, so they could only ever read as no data, and the rest fired on remediation
# internals that nobody is paged for. A rule that cannot fire teaches an operator to
# ignore the ones that can.
#
# What is left is the two questions that are worth waking somebody for, plus one
# warning that predicts an outage rather than reporting one.
#
# No-data behaviour is stated on every rule because it is the difference between "the
# service is fine" and "the service stopped reporting", and the two are not the same
# incident. Import these with each rule's declared noDataState; do not let Grafana
# apply its "Alerting" default to a rule that asks for OK.
#
# The Cloud Monitoring equivalents live in infrastructure/monitoring/*.tf, so the owner
# can be paged without standing up Grafana at all. Keep the two in step.
groups:
  - name: mitig8it-reviews
    interval: 1m
    rules:
      # Reviews are running and most of them are failing. A transient re-queue is
      # excluded: that run has not failed for the pull request author yet, and counting
      # it here would page for work that is still on its way to succeeding.
      #
      # The `>= 3` floor is what keeps a quiet hour off the pager: one failure out of
      # one run is 100 percent and means almost nothing.
      #
      # No data means no analysis run started in the window at all. That is not this
      # alert's job to report, so it reads as OK here and as an incident in
      # Mitig8itReviewsStalled below.
      - alert: Mitig8itReviewsFailing
        expr: |
          (
            sum(increase(mitig8it_analysis_runs_failed_total{reason!="transient_retried"}[15m]))
            /
            sum(increase(mitig8it_analysis_runs_started_total[15m]))
          ) > 0.3
          and
          sum(increase(mitig8it_analysis_runs_started_total[15m])) >= 3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "More than 30 percent of security reviews are failing"
          description: >-
            Over the last 15 minutes more than three analysis runs started and more than
            30 percent of them ended without publishing a review. Break the failures down
            by the `reason` label: `analysis_incomplete` is ours, `github_files_invalid`
            and `publication_incomplete` point at GitHub, `infrastructure` points at the
            network or a cold downstream.
          runbook_url: "docs/runbooks/observability.md#reviews-are-failing"
        # OK, not Alerting: a window with no runs is covered by the stall rule.
        isPaused: false
        noDataState: OK
        execErrState: Alerting

      # Work is waiting and nothing is picking it up. The condition joins a queue age to
      # the absence of starts, and the service derives it into one gauge rather than
      # leaving the join to be reconstructed here, where nobody could check it.
      #
      # This rule reports a stall and nothing else. It used to carry
      # `noDataState: Alerting` on the reasoning that absent metrics are themselves the
      # outage, which is true but cannot distinguish a dead API from a scrape that was
      # never configured. The metrics sidecar is opt-in through METRICS_SIDECAR_ENABLED,
      # so for every deployment that has not enabled it this rule fired on no data,
      # every evaluation, forever. A page that is always firing is a page nobody reads.
      #
      # The absence is now asserted by Mitig8itAnalysisMetricsAbsent below, which is how
      # infrastructure/monitoring/main.tf has always done it: the stall gauge and a
      # separate absence condition, combined with OR. These two files are supposed to be
      # in step and had drifted.
      - alert: Mitig8itReviewsStalled
        expr: max(mitig8it_analysis_runs_stalled) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Analysis runs are queued but none has started"
          description: >-
            Pending analysis runs are older than ten minutes and no run has moved into
            the running state for ten minutes. Check that at least one API instance is
            serving, that the queue worker started, and that the database is reachable:
            the claim query is the first thing a database outage stops.
          runbook_url: "docs/runbooks/observability.md#reviews-are-stalled"
        isPaused: false
        # OK, because absence is a different incident with its own rule. The gauge is
        # set to 0 on every queue observation, so a scraped and healthy API reports 0
        # here rather than nothing.
        noDataState: OK
        execErrState: Alerting

      # The scrape itself stopping. A PromQL condition cannot fire on a series that is
      # not there, so the absence is asserted directly. Fifteen minutes and the started
      # counter, matching the condition_absent block in
      # infrastructure/monitoring/main.tf so the two systems page for the same thing.
      #
      # Paused, and it has to stay paused until the sidecar is on. METRICS_SIDECAR_ENABLED
      # is opt-in, and while it is off this rule is true by construction and says nothing
      # an operator can act on. docs/runbooks/observability.md has the enablement steps and
      # names unpausing this rule as part of them, because a paged rule left paused after
      # the scrape starts is a silent outage.
      #
      # Deliberately split from Mitig8itReviewsStalled rather than folded into it: pausing
      # the absence check costs visibility of a missing scrape, while pausing the stall
      # check would hide a real backlog. Only one of those is safe to switch off.
      - alert: Mitig8itAnalysisMetricsAbsent
        expr: absent(mitig8it_analysis_runs_started_total)
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "codesentry-api stopped reporting analysis metrics"
          description: >-
            The analysis started counter has not arrived for fifteen minutes. Either the
            API is not serving, or the managed Prometheus sidecar is not scraping it.
            Check that a revision is serving and that the sidecar container is present in
            it: the API deploy asserts this when METRICS_SIDECAR_ENABLED is true.
          runbook_url: "docs/runbooks/observability.md#reviews-are-stalled"
        isPaused: true
        noDataState: Alerting
        execErrState: Alerting

  - name: mitig8it-remediation
    interval: 1m
    rules:
      # A warning, deliberately. One reclaim is normal recovery after an instance
      # restart; several in half an hour mean workers are dying mid-job, which usually
      # precedes an outage rather than being one.
      #
      # No data reads as OK: a deployment that runs no remediation worker emits no
      # reclaims, and that is a configuration, not an incident.
      - alert: Mitig8itRemediationLeaseReclaim
        expr: increase(mitig8it_remediation_lease_reclaims_total[30m]) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Remediation worker leases are being reclaimed repeatedly"
          description: >-
            More than three remediation job leases expired and were reclaimed in half an
            hour. Workers are most likely being killed mid-job. Check instance restarts
            and memory limits before the next deploy.
          runbook_url: "docs/runbooks/remediation.md#expired-worker-lease"
        isPaused: false
        noDataState: OK
        execErrState: OK
