apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress-egress
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remediation-service-to-broker-dns-and-otel-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: remediation-service
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-broker
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: remediation-otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Egress is an approved proxy/gateway CIDR, never a direct public range.
    # It carries provider/GCS traffic and must authenticate upstream itself.
    - to:
        - ipBlock:
            cidr: __REMEDIATION_EXTERNAL_EGRESS_CIDR__
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: __REMEDIATION_DATABASE_CIDR__
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remediation-worker-to-broker-dns-and-otel-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: remediation-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-broker
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: remediation-otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - to:
        - ipBlock:
            cidr: __REMEDIATION_EXTERNAL_EGRESS_CIDR__
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: __REMEDIATION_DATABASE_CIDR__
      ports:
        - protocol: TCP
