apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-service
  annotations:
    iam.gke.io/gcp-service-account: __REMEDIATION_API_GCP_SERVICE_ACCOUNT__
  labels:
    app.kubernetes.io/part-of: mitig8it-remediation
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-worker
  annotations:
    iam.gke.io/gcp-service-account: __REMEDIATION_WORKER_GCP_SERVICE_ACCOUNT__
  labels:
    app.kubernetes.io/part-of: mitig8it-remediation
# The worker needs only its projected Workload Identity token for Postgres/GCS,
# never Kubernetes API RBAC.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-broker
  labels:
    app.kubernetes.io/part-of: mitig8it-remediation
# The broker alone needs an in-cluster token to create one-use Jobs and Secrets.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-no-access
  labels:
    app.kubernetes.io/part-of: mitig8it-remediation
# Runner pods must have neither a token mount nor an RBAC binding.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-broker-job-controller
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-broker-job-controller
subjects:
  - kind: ServiceAccount
    name: sandbox-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-broker-job-controller
