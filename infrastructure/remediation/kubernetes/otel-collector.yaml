apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-otel-collector-config
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024
      tail_sampling:
        decision_wait: 10s
        num_traces: 5000
        expected_new_traces_per_sec: 100
        policies:
          - name: retain-errors
            type: status_code
            status_code: {status_codes: [ERROR]}
          - name: retain-ten-percent-of-other-traces
            type: probabilistic
            probabilistic: {sampling_percentage: 10}
      attributes/redact_source:
        actions:
          - key: code
            action: delete
          - key: source
            action: delete
          - key: prompt
            action: delete
          - key: completion
            action: delete
          - key: patch
            action: delete
    exporters:
      otlphttp/upstream:
        endpoint: ${env:UPSTREAM_OTLP_ENDPOINT}
        headers:
          authorization: ${env:UPSTREAM_OTLP_AUTHORIZATION}
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact_source, tail_sampling, batch]
          exporters: [otlphttp/upstream]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact_source, batch]
          exporters: [otlphttp/upstream]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact_source, batch]
          exporters: [otlphttp/upstream]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-otel-collector
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-otel-collector
  labels:
    app.kubernetes.io/name: remediation-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remediation-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediation-otel-collector
    spec:
      serviceAccountName: remediation-otel-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: __OTEL_COLLECTOR_IMAGE__
          args: ["--config=/conf/collector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          envFrom:
            - secretRef: {name: remediation-observability-secrets}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: remediation-otel-collector-config}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: remediation-otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
